:root{--navy:#071a39;--navy2:#0d2e5d;--blue:#2f6fed;--ink:#14283f;--muted:#71869e;--line:#dce7f2;--bg:#f5f8fc;--card:#fff;--good:#18795a;--warn:#9a6a12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#071a39,#092550);padding:20px 16px;color:white;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:18px}.brand img{width:65px;height:43px;object-fit:contain;background:#fff;border-radius:10px;padding:4px}.brand b{font-size:12px;letter-spacing:.08em}.brand small{display:block;font-size:8px;color:#8eabd0;letter-spacing:.12em}.nav{display:flex;flex-direction:column;gap:6px;margin-top:18px}.nav button{border:0;background:transparent;color:#91a9c3;text-align:left;padding:11px 12px;border-radius:11px;font-weight:780;cursor:pointer}.nav button.active,.nav button:hover{background:rgba(255,255,255,.09);color:#fff;box-shadow:inset 2px 0 #5f98ff}.main{min-width:0}.top{height:66px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px;position:sticky;top:0;z-index:10}.content{max-width:1480px;margin:auto;padding:26px}.screen{display:none}.screen.active{display:block}.hero{background:linear-gradient(125deg,#08224b,#0e3b74);border-radius:24px;color:#fff;padding:30px;display:flex;justify-content:space-between;gap:24px;align-items:center;box-shadow:0 22px 55px rgba(10,43,89,.17)}.hero h1,.pageHead h1{font-size:34px;letter-spacing:-.04em;margin:7px 0 9px}.hero p,.pageHead p{color:#b6c9e1;line-height:1.6;font-size:13px;max-width:760px}.pageHead p{color:var(--muted)}.eyebrow{font-size:9px;letter-spacing:.17em;color:#85b5ff;font-weight:900}.btn{border:0;background:var(--blue);color:#fff;border-radius:11px;padding:10px 14px;font-weight:850;cursor:pointer}.btn.secondary{background:#fff;color:#1d569e;border:1px solid #cddbef}.btn.dark{background:#0a2b59}.btn.ghost{background:#edf4ff;color:#235ca8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:16px 0}.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 11px 30px rgba(22,52,88,.05)}.stat small,.label{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:#7b8ea5;font-weight:850}.stat strong{display:block;font-size:25px;margin:4px 0}.muted{color:var(--muted);font-size:10px;line-height:1.5}.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pageHead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:15px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid #d6e1ed;border-radius:10px;padding:10px 11px;background:#fff;color:#18324e}.toolbar input{min-width:250px}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:11px}.table th{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:8px;text-transform:uppercase;letter-spacing:.09em;color:#6e8299}.table td{padding:12px 10px;border-bottom:1px solid #edf2f7}.pill,.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:8px;font-weight:850}.pill{background:#eaf7f0;color:#247a57}.badge{background:#eef4fd;color:#2b64ad}.score{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ebf3ff;color:#1e5cb1;font-weight:900}.metricGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#f7f9fc;border:1px solid #e1e8f0;border-radius:12px;padding:11px}.metric b{display:block;font-size:19px}.item{border:1px solid #e1e8f1;border-radius:12px;padding:12px;margin-bottom:8px}.item b{font-size:11px}.item p{font-size:10px;color:#667d96;line-height:1.5;margin:5px 0}.empty{padding:25px;text-align:center;color:#8193a8}.modal{display:none;position:fixed;inset:0;background:rgba(5,19,40,.58);align-items:center;justify-content:center;padding:20px;z-index:30}.modal.show{display:flex}.modalCard{background:#fff;border-radius:20px;padding:21px;width:min(900px,96vw);max-height:92vh;overflow:auto}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px;font-size:9px;font-weight:800;color:#60758d}.full{grid-column:1/-1}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#0a2c59;color:#fff;border-radius:11px;padding:11px 14px;font-size:10px;z-index:50}.toast.show{display:block}.callout{border:1px solid #cfe0f6;background:linear-gradient(135deg,#f3f8ff,#fff);border-radius:16px;padding:15px}.portfolioCard{display:grid;grid-template-columns:80px 1fr auto;gap:14px;align-items:center}.portfolioCard img{width:80px;height:64px;object-fit:contain;border-radius:10px;background:#f4f7fb}.funnel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.funnel span{background:#eef4fd;border:1px solid #d7e4f3;border-radius:999px;padding:8px 10px;font-size:9px;font-weight:800;color:#315f96}.funnel i{color:#8aa2bd}.uploadBox{border:1px dashed #b8cbe1;border-radius:14px;padding:22px;text-align:center;background:#f9fbfe}.seg{display:flex;gap:7px;flex-wrap:wrap}.seg button{border:1px solid #d4e1ef;background:#fff;color:#4b6682;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:800;cursor:pointer}.seg button.active{background:#0d3b73;color:#fff}.statusDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2ca66f;margin-right:6px}

@media(max-width:1100px){.stats,.grid3,.metricGrid,.assumptionGrid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;padding:12px}.brand{padding-bottom:10px}.brand img{width:52px;height:36px}.nav{flex-direction:row;overflow-x:auto;overscroll-behavior-inline:contain;padding-bottom:4px}.nav button{white-space:nowrap;min-height:44px}.top{height:58px;padding:0 12px}.content{padding:17px 12px}.hero{flex-direction:column;align-items:flex-start;padding:21px;border-radius:18px}.hero h1,.pageHead h1{font-size:28px}.pageHead{flex-direction:column;gap:10px}.pageHead>div:last-child{width:100%}.toolbar{align-items:stretch}.toolbar input,.toolbar select{min-width:0;width:100%;font-size:16px}.field input,.field select,.field textarea{font-size:16px;max-width:100%}.btn{min-height:44px}.tableWrap{-webkit-overflow-scrolling:touch}.table{min-width:720px}.modal{align-items:flex-start;padding:8px}.modalCard{width:100%;max-height:calc(100vh - 16px);padding:17px;border-radius:15px}.formGrid{grid-template-columns:1fr}.full{grid-column:auto}.portfolioCard{grid-template-columns:58px 1fr}.portfolioCard img{width:58px;height:50px}.toast{left:12px;right:12px;bottom:12px;text-align:center}}@media(max-width:520px){.stats,.grid3,.metricGrid,.assumptionGrid{grid-template-columns:1fr}.top b{font-size:8px!important}.top .btn{padding:8px 10px}.hero h1,.pageHead h1{font-size:25px}.card{padding:14px}.resultHero{padding:14px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><img src="/logo.jpeg"><div><b>LAUNCHPAD36 AI</b><small>COMMERCIAL REVENUE INTELLIGENCE</small></div></div><div id="nav" class="nav"></div></aside><main class="main"><header class="top"><div><span class="statusDot"></span><b style="font-size:10px;letter-spacing:.08em">V9.8.3 LIVING INTELLIGENCE</b></div><div><button class="btn secondary" onclick="openAdmin()" id="authBtn">Admin Unlock</button></div></header><div class="content" id="content"></div></main></div><div id="modal" class="modal"><div class="modalCard" id="modalCard"></div></div><div class="toast" id="toast"></div><script>
const NAV=['Dashboard','Find Me Revenue','Market Intelligence','Channel Intelligence','Accounts','Products & Brands','Buyers','Opportunities','Evidence','System Status'];
const state={auth:false,portfolio:{brands:[],products:[]},orgs:[],opps:[],marketOpportunity:null,buyers:[],evidence:[],pendingReview:0,session:null,screen:'Dashboard'};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
async function api(url,o={}){const r=await fetch(url,{credentials:'same-origin',headers:{'content-type':'application/json',...(o.headers||{})},...o});const txt=await r.text();let d={};try{d=JSON.parse(txt)}catch{d={error:txt}}if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function nav(){ $('nav').innerHTML=NAV.map(n=>`<button class="${n===state.screen?'active':''}" onclick="show('${n}')">${n}</button>`).join('') }
function show(n){if(n!=='Dashboard'&&!state.auth){openAdmin();return}state.screen=n;nav();render();if(n==='System Status')loadSystemStatus();if(n==='Evidence')loadEvidence();if(n==='Buyers')loadBuyerAccount()}
async function boot(){nav();try{const s=await api('/api/session');state.auth=!!s.authenticated;state.session=s}catch{}if(state.auth)await load();renderAuth();render()}
function renderAuth(){$('authBtn').textContent=state.auth?'Lock Session':'Admin Unlock';$('authBtn').onclick=state.auth?logout:openAdmin}
async function load(){try{state.portfolio=await api('/api/portfolio');const u=await api('/api/account-universe?limit=500');state.orgs=u.organizations||[]}catch(e){toast(e.message)}}
function render(){const c=$('content');if(!state.auth){c.innerHTML=locked();return}const fn={'Dashboard':dashboard,'Find Me Revenue':findRevenue,'Market Intelligence':market,'Channel Intelligence':channel,'Accounts':accounts,'Products & Brands':products,'Buyers':buyers,'Opportunities':opportunities,'Evidence':evidence,'System Status':systemStatus}[state.screen]||dashboard;c.innerHTML=fn()}
function locked(){return `<div class="hero"><div><div class="eyebrow">LAUNCHPAD36 AI V9.8.3</div><h1>Retail revenue intelligence, rebuilt around your portfolio.</h1><p>V9.8.3 separates each customer's private brands and SKUs from shared public intelligence and adds source-tracked living evidence. Unlock the controlled build to continue.</p></div><button class="btn" onclick="openAdmin()">Unlock Platform</button></div>`}
function dashboard(){const p=state.portfolio.products||[],b=state.portfolio.brands||[],o=state.orgs||[];return `<div class="hero"><div><div class="eyebrow">EXECUTIVE REVENUE COMMAND CENTER</div><h1>From portfolio to market opportunity.</h1><p>Launchpad36 maps your brands and SKUs across channels, searches the retail account universe, then moves from market → channel → account → buyer → opportunity.</p></div><button class="btn" onclick="show('Find Me Revenue')">Find Me Revenue</button></div><div class="stats"><div class="card stat"><small>Brands</small><strong>${b.length}</strong><span class="muted">Tenant-owned portfolio</span></div><div class="card stat"><small>Products</small><strong>${p.length}</strong><span class="muted">Across product families</span></div><div class="card stat"><small>Searchable Accounts</small><strong>${o.length}</strong><span class="muted">Loaded from shared universe</span></div><div class="card stat"><small>Ranked Opportunities</small><strong>${state.opps.length}</strong><span class="muted">Current Find Me Revenue run</span></div></div><div class="grid2"><div class="card"><h3>Revenue Intelligence Flow</h3><div class="funnel"><span>Portfolio</span><i>→</i><span>Market</span><i>→</i><span>Channel</span><i>→</i><span>Accounts</span><i>→</i><span>Buyers</span><i>→</i><span>Opportunities</span></div><p class="muted">Market and Channel Intelligence now operate above individual retailer accounts, as portfolio-level views.</p></div><div class="callout"><b>Catalog onboarding</b><p class="muted">Upload Excel/CSV, discover products from a vendor website, or add items manually. Product imagery can be referenced from authoritative vendor URLs after review.</p><button class="btn ghost" onclick="show('Products & Brands')">Open Catalog</button></div></div>`}
function findRevenue(){const ps=state.portfolio.products||[];return `<div class="pageHead"><div><h1>Find Me Revenue</h1><p>Rank the shared retail account universe against one product's categories and target channels.</p></div></div><div class="card"><div class="toolbar"><select id="frProduct"><option value="">Choose product</option>${ps.map(p=>`<option value="${p.id}">${esc(p.brand_name||'')} — ${esc(p.name)}</option>`).join('')}</select><select id="frLimit"><option>25</option><option>50</option><option selected>100</option><option>250</option></select><button class="btn" onclick="runFindRevenue()">Rank Accounts</button></div><div id="frResults">${renderOpps()}</div></div>`}
function renderOpps(){if(!state.opps.length)return `<div class="empty">Choose a product and rank the account universe.</div>`;return `<div class="tableWrap"><table class="table"><thead><tr><th>Account</th><th>Fit</th><th>Channels</th><th>Categories</th><th>Evidence State</th></tr></thead><tbody>${state.opps.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.domain||'')}</div></td><td><span class="score">${x.fit_score}</span></td><td>${(x.channels||[]).map(c=>`<span class="badge">${esc(c)}</span>`).join(' ')}</td><td>${(x.categories||[]).slice(0,4).map(c=>`<span class="pill">${esc(c)}</span>`).join(' ')}</td><td>${esc(x.verification_status||'UNKNOWN')}</td></tr>`).join('')}</tbody></table></div>`}
async function runFindRevenue(){const product_id=$('frProduct').value;if(!product_id){toast('Choose a product');return}try{const d=await api('/api/find-me-revenue',{method:'POST',body:JSON.stringify({product_id,limit:Number($('frLimit').value)})});state.opps=d.opportunities||[];$('frResults').innerHTML=renderOpps();toast(`Ranked ${state.opps.length} accounts`)}catch(e){toast(e.message)}}
function market(){const ps=state.portfolio.products||[];return `<div class="pageHead"><div><h1>Market Opportunity</h1><p>Model manufacturer revenue across multiple products, then drill into the accounts and SKUs creating the opportunity.</p></div><span class="sourceTag">MODELED · ASSUMPTION-BACKED</span></div><div class="grid2"><div class="card"><div class="label">1 · SELECT PRODUCTS</div><div class="toolbar" style="margin-top:10px"><button class="btn ghost" onclick="toggleMarketProducts(true)">Select All</button><button class="btn secondary" onclick="toggleMarketProducts(false)">Clear</button></div><div class="productPicker">${ps.map(p=>`<label class="productChoice"><input class="moProduct" type="checkbox" value="${esc(p.id)}"><span><b>${esc(p.brand_name||'')} · ${esc(p.name)}</b><span class="muted" style="display:block">${esc(p.product_family||p.category||'Uncategorized')} · ${(p.variants||[]).length} SKU(s)</span></span></label>`).join('')||'<div class="empty">Import products before modeling market opportunity.</div>'}</div></div><div class="card"><div class="label">2 · ROUTE & ASSUMPTIONS</div><div class="field" style="margin-top:10px"><label>Route to market</label><select id="moRoute" onchange="updateMarketFields()"><option value="retail">Retail</option><option value="direct_b2b">Direct B2B</option><option value="distributor_dealer">Distributor / Dealer</option><option value="mixed">Mixed Channels</option></select></div><div class="assumptionGrid" style="margin-top:10px"><div class="field"><label id="moUnitsLabel">Annual units per location, per SKU</label><input id="moUnits" type="number" min="0" value="12"></div><div class="field"><label id="moProbabilityLabel">Distribution probability (%)</label><input id="moProbability" type="number" min="0" max="100" value="25"></div><div class="field"><label>Portfolio overlap discount (%)</label><input id="moOverlap" type="number" min="0" max="100" value="10"></div><div class="field"><label>Scenario range</label><input value="65% low · 135% high" disabled></div></div><p class="muted">Catalog wholesale price is used when available. Otherwise the model shows and flags a 60%-of-MSRP estimate.</p><button class="btn dark" onclick="runMarketOpportunity()">Calculate Opportunity</button></div></div><div id="marketResults" style="margin-top:15px">${renderMarketResults()}</div>`}
function toggleMarketProducts(checked){document.querySelectorAll('.moProduct').forEach(x=>x.checked=checked)}
function updateMarketFields(){const retail=$('moRoute')?.value==='retail';if($('moUnitsLabel'))$('moUnitsLabel').textContent=retail?'Annual units per location, per SKU':'Units per account, per SKU';if($('moProbabilityLabel'))$('moProbabilityLabel').textContent=retail?'Distribution probability (%)':'Win probability (%)'}
const fmtMoney=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)||0);
async function runMarketOpportunity(){const product_ids=[...document.querySelectorAll('.moProduct:checked')].map(x=>x.value);if(!product_ids.length){toast('Select at least one product');return}const route=$('moRoute').value,units=Number($('moUnits').value),probability=Number($('moProbability').value),assumptions={portfolio_overlap_discount:Number($('moOverlap').value),low_multiplier:.65,high_multiplier:1.35};if(route==='retail'){assumptions.annual_units_per_location=units;assumptions.distribution_probability=probability}else{assumptions.units_per_account=units;assumptions.win_probability=probability}const target=$('marketResults');target.innerHTML='<div class="card empty">Calculating portfolio opportunity…</div>';try{state.marketOpportunity=await api('/api/market-opportunity',{method:'POST',body:JSON.stringify({product_ids,route_to_market:route,assumptions})});target.innerHTML=renderMarketResults();toast(`Modeled ${state.marketOpportunity.summary.target_account_count} accounts`)}catch(e){target.innerHTML=`<div class="card"><h3 style="color:#b53b3b">Opportunity could not be calculated</h3><p class="muted">${esc(e.message)}</p></div>`}}
function renderMarketResults(){const d=state.marketOpportunity;if(!d)return `<div class="card empty">Select one or more products and calculate the modeled opportunity.</div>`;const s=d.summary||{},a=d.assumptions||{},rows=d.account_opportunities||[];return `<div class="resultHero"><div class="label" style="color:#85b5ff">MODELED ADDRESSABLE OPPORTUNITY</div><div class="stats"><div class="card stat"><small>Low</small><strong>${fmtMoney(s.low_manufacturer_revenue)}</strong><span class="muted">65% of base case</span></div><div class="card stat"><small>Base Manufacturer Revenue</small><strong>${fmtMoney(s.base_manufacturer_revenue)}</strong><span class="muted">Wholesale revenue</span></div><div class="card stat"><small>High</small><strong>${fmtMoney(s.high_manufacturer_revenue)}</strong><span class="muted">135% of base case</span></div><div class="card stat"><small>Retail / End-Customer Value</small><strong>${fmtMoney(s.base_retail_value)}</strong><span class="muted">Supporting value, not revenue</span></div></div></div><div class="stats"><div class="card stat"><small>Selected Products</small><strong>${s.selected_product_count||0}</strong></div><div class="card stat"><small>Priced SKUs</small><strong>${s.priced_sku_count||0}</strong></div><div class="card stat"><small>Qualified Accounts</small><strong>${s.target_account_count||0}</strong></div><div class="card stat"><small>Profile Coverage</small><strong>${s.account_category_coverage||0}%</strong></div></div><div class="grid2"><div class="card"><h3>Likely Account Fit</h3><div class="tableWrap"><table class="table"><thead><tr><th>Account</th><th>Route</th><th>Fit</th><th>Why It Fits</th><th>Locations</th><th>Base Revenue</th><th>Drill Down</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.domain||'')}</div></td><td>${esc(x.organization_type||a.route_to_market)}</td><td><span class="score">${Number(x.fit_score)||0}</span><div class="muted">${esc(x.fit_tier)}</div></td><td class="muted">${esc(x.fit_reason)}</td><td>${x.footprint||'—'}</td><td><b>${fmtMoney(x.base_manufacturer_revenue)}</b></td><td><button class="btn ghost" onclick="openMarketAccount(${i})">View SKUs</button></td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">No accounts have a defensible category fit for the selected products. Accounts with missing or incompatible profiles are excluded rather than shown as false opportunities.</div>'}</div></div><div class="card"><h3>Model Inputs</h3><div class="item"><b>Route: ${esc(String(a.route_to_market||'').replaceAll('_',' '))}</b><p>${a.route_to_market==='retail'?`${a.annual_units_per_location} annual units/location/SKU · ${a.distribution_probability}% distribution probability`:`${a.units_per_account} units/account/SKU · ${a.win_probability}% win probability`} · ${a.portfolio_overlap_discount}% portfolio overlap discount.</p><span class="sourceTag">${esc(a.provenance)}</span></div>${(d.category_totals||[]).map(x=>`<div class="item"><b>${esc(x.category)}</b><p>${fmtMoney(x.base_manufacturer_revenue)} modeled manufacturer revenue</p></div>`).join('')}${(d.warnings||[]).map(x=>`<div class="warning">${esc(x)}</div>`).join('')}</div></div>`}

let accountResearchRunning=false;async function runAccountResearch(orgId){if(accountResearchRunning){toast('Account research is already running');return}const result=$('accountResearchResult'),button=$('researchRunBtn'),website=$('researchWebsite').value.trim(),category_focus=$('researchCategory').value.trim();if(!website||!category_focus){toast('Enter the account website and product category');return}accountResearchRunning=true;button.disabled=true;button.textContent='Research Running…';const started=Date.now(),stages=['Connecting to account website','Finding relevant product pages','Filtering products by category','Searching the public web with OpenAI','Validating buyer sources','Saving attributable evidence'];result.innerHTML=`<div class="callout"><b id="researchStage">${stages[0]}</b><div class="progressTrack"><div id="researchProgress" class="progressBar"></div></div><div class="progressMeta"><span>This can take 30–120 seconds.</span><span id="researchElapsed">0 seconds</span></div></div>`;const timer=setInterval(()=>{const seconds=Math.floor((Date.now()-started)/1000),stage=Math.min(stages.length-1,Math.floor(seconds/15)),progress=Math.min(94,10+seconds*.7);if($('researchStage'))$('researchStage').textContent=stages[stage];if($('researchProgress'))$('researchProgress').style.width=`${progress}%`;if($('researchElapsed'))$('researchElapsed').textContent=`${seconds} seconds`},500);try{const d=await api('/api/account-research',{method:'POST',body:JSON.stringify({organization_id:orgId,website,category_focus})});const buyers=d.buyers||[],r=d.research||{},sources=r.buyer_sources||{},openai=sources.openai_web_search||{},apollo=sources.apollo||{},corporate=sources.corporate_pages||{};result.innerHTML=`<div class="callout"><b>Account research completed</b><div class="progressTrack"><div class="progressBar" style="width:100%"></div></div><p class="muted">${Number(r.pages_discovered)||0} product pages · ${Number(r.offerings)||0} relevant products · ${Number(r.discarded_ir function syncEvidenceAccount(){const org=(state.orgs||[]).find(o=>String(o.id)===String($('evidenceAccount')?.value));if(org){$('evidenceWebsite').value=org.domain||org.source_url||'';$('evidenceCategory').value=(org.categories||[])[0]||''}loadEvidence()}
function researchEvidenceAccount(){const orgId=$('evidenceAccount')?.value;if(!orgId){toast('Choose an account');return}openAccountResearch(orgId);setTimeout(()=>{if($('researchWebsite'))$('researchWebsite').value=$('evidenceWebsite')?.value||'';if($('researchCategory'))$('researchCategory').value=$('evidenceCategory')?.value||''},0)}
async function loadEvidence(){const target=$('evidenceResults');if(!target)return;target.innerHTML='<div class="card empty">Loading commercial evidence…</div>';try{const orgId=$('evidenceAccount')?.value||'',d=await api(`/api/living-intelligence-status?limit=250${orgId?`&organization_id=${encodeURIComponent(orgId)}`:''}`);state.evidence=d.operational_status||[];state.pendingReview=Number(d.pending_review)||0;target.innerHTML=`<div class="stats"><div class="card stat"><small>Latest Observations</small><strong>${state.evidence.length}</strong><span class="muted">One latest record per subject</span></div><div class="card stat"><small>Structured Products</small><strong>${state.evidence.reduce((n,x)=>n+(Number(x.offering_count)||0),0)}</strong><span class="muted">Explicitly extracted relevant products</span></div><div class="card stat"><small>Pending Review</small><strong>${state.pendingReview}</strong><span class="muted">Latest observations requiring review</span></div><div class="card stat"><small>Verified</small><strong>${state.evidence.filter(x=>x.verification_status==='VERIFIED').length}</strong><span class="muted">Deterministically verified evidence</span></div></div><div class="card tableWrap"><table class="table"><thead><tr><th>Account</th><th>Subject</th><th>Products</th><th>Evidence Type</th><th>Observed</th><th>Confidence</th><th>Status</th><th>Changed</th><th>Source</th><th>Review</th></tr></thead><tbody>${state.evidence.map(x=>`<tr><td><b>${esc(x.account_name||'—')}</b></td><td><b>${esc(x.subject_type)}</b><div class="muted">${esc(x.subject_key)}</div></td><td><b>${Number(x.offering_count)||0}</b></td><td><span class="badge">${esc(x.evidence_type)}</span></td><td>${x.observed_at?esc(new Date(x.observed_at).toLocaleString()):'—'}</td><td>${Number(x.confidence)||0}%</td><td><span class="pill">${esc(x.verification_status||'UNKNOWN')}</span></td><td>${x.changed_since_last_check?'Yes':'No'}</td><td>${x.source_url?`<a href="${esc(x.source_url)}" target="_blank" rel="noopener noreferrer">Open source</a>`:'—'}</td><td>${Number(x.offering_count)>0?`<button class="btn ghost" onclick="openEvidenceReview(${Number(x.evidence_id)})">Review Products</button>`:'Source only'}</td></tr>`).join('')}</tbody></table>${state.evidence.length?'':'<div class="empty">No commercial evidence has been stored for this selection.</div>'}</div>`}catch(e){target.innerHTML=`<div class="card"><h3 style="color:#b53b3b">Evidence could not be loaded</h3><p class="muted">${esc(e.message)}</p></div>`}}
async function extractStructuredProducts(){try{toast('Extracting category-relevant products…');const d=await api('/api/living-intelligence-refresh',{method:'POST',body:JSON.stringify({limit:25,force:true})}),count=(d.results||[]).reduce((n,x)=>n+(Number(x.offering_count)||0),0),discarded=(d.results||[]).reduce((n,x)=>n+(Number(x.discarded_irrelevant_count)||0),0),failed=(d.results||[]).filter(x=>x.status!=='SUCCESS');if(failed.length)throw new Error(failed[0].error||'Structured extraction failed');toast(`Kept ${count}; rejected ${discarded} irrelevant products`);await loadEvidence()}catch(e){toast(e.message)}}
async function openReplaceMonitor(){$('modalCard').innerHTML='<div class="empty">Loading active monitoring targets…</div>';$('modal').classList.add('show');try{const d=await api('/api/monitor-targets'),targets=(d.monitor_targets||[]).filter(x=>x.state==='active');$('modalCard').innerHTML=`<h2>Replace Monitoring Target</h2><p class="muted">Only the selected target will be deactivated. Use a real retailer search or category-results URL and a narrow category focus. https:// is optional.</p><div class="formGrid"><div class="field full"><label>Target to replace</label><select id="replaceTarget">${targets.map(x=>`<option value="${esc(x.id)}">${esc(x.source_url)}</option>`).join('')}</select></div><div class="field full"><label>New retailer category/search URL</label><input id="replaceUrl" placeholder="homedepot.com/s/tv%20mounts"></div><div class="field"><label>Category focus</label><input id="replaceFocus" value="TV mounts"></div><div class="field"><label>Refresh cadence</label><select id="replaceTier"><option value="weekly">Weekly</option><option value="daily">Daily</option><option value="monthly">Monthly</option></select></div></div><div id="replaceResult" style="margin-top:12px"></div><div style="margin-top:15px"><button class="btn" ${targets.length?'':'disabled'} onclick="saveReplacementMonitor()">Replace & Test Target</button> <button class="btn secondary" onclick="closeModal()">Cancel</button></div>`}catch(e){$('modalCard').innerHTML=`<h3>Targets could not be loaded</h3><p class="muted">${esc(e.message)}</p>`}}
async function saveReplacementMonitor(){const url=$('replaceUrl').value.trim(),focus=$('replaceFocus').value.trim(),targetId=$('replaceTarget').value,result=$('replaceResult');if(!url||!focus||!targetId){toast('Select a target and enter a URL and category');return}result.innerHTML='<div class="empty">Replacing target and testing category relevance…</div>';try{await api('/api/monitor-targets',{method:'POST',body:JSON.stringify({source_url:url,category_focus:focus,target_type:'retailer_assortment',refresh_tier:$('replaceTier').value,replace_target_id:targetId})});const d=await api('/api/living-intelligence-refresh',{method:'POST',body:JSON.stringify({limit:1,force:true})}),first=d.results?.[0];if(!first||first.status!=='SUCCESS')throw new Error(first?.error||'Replacement target test failed');result.innerHTML=`<div class="callout"><b>${Number(first.offering_count)||0} relevant products retained</b><p class="muted">Category: ${esc(first.category_focus||focus)} · ${Number(first.discarded_irrelevant_count)||0} unrelated products rejected. Resolved URL: ${esc(first.resolved_url||url)}</p></div>`;setTimeout(async()=>{closeModal();await loadEvidence()},1800)}catch(e){result.innerHTML=`<div class="callout"><b style="color:#b53b3b">Target test failed</b><p class="muted">${esc(e.message)}</p></div>`}}
async function openEvidenceReview(id){$('modalCard').innerHTML='<div class="empty">Loading structured evidence…</div>';$('modal').classList.add('show');try{const d=await api(`/api/evidence-review?id=${id}`),e=d.evidence,rows=e.offerings||[];$('modalCard').innerHTML=`<h2>Review Structured Products</h2><p class="muted">Source: <a href="${esc(e.source_url)}" target="_blank" rel="noopener noreferrer">${esc(e.source_url)}</a><br>Observed ${esc(new Date(e.observed_at).toLocaleString())} · Confidence ${Number(e.confidence)||0}% · ${esc(e.verification_status)}</p><div class="tableWrap"><table class="table"><thead><tr><th>Brand</th><th>Product</th><th>Price</th><th>Availability</th><th>Evidence quote</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.brand||'—')}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.price_text||'—')}</td><td>${esc(x.availability||'—')}</td><td class="muted">${esc(x.evidence_quote||'No exact quote extracted')}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">No structured products are available for review.</div>'}</div><div style="margin-top:15px">${e.verification_status==='VERIFIED'?'<span class="pill">Verified commercial truth</span>':e.verification_status==='REJECTED'?'<span class="badge">Rejected evidence</span>':`<button class="btn dark" ${rows.length?'':'disabled'} onclick="approveEvidence(${id})">Approve as Verified</button> <button class="btn secondary" onclick="rejectEvidence(${id})">Reject Evidence</button>`} <button class="btn secondary" onclick="closeModal()">Close</button></div>`}catch(e){$('modalCard').innerHTML=`<h3>Evidence could not be loaded</h3><p class="muted">${esc(e.message)}</p><button class="btn secondary" onclick="closeModal()">Close</button>`}}
async function approveEvidence(id){if(!confirm('Approve these structured products as verified commercial evidence?'))return;try{const d=await api('/api/evidence-review',{method:'POST',body:JSON.stringify({evidence_id:id,action:'approve'})});if(!d.approved)throw new Error('Evidence approval did not complete');closeModal();toast('Evidence approved as verified');await loadEvidence()}catch(e){toast(e.message)}}
async function rejectEvidence(id){const reason=prompt('Reason for rejection','Products are unrelated to the target category');if(reason===null)return;try{const d=await api('/api/evidence-review',{method:'POST',body:JSON.stringify({evidence_id:id,action:'reject',reason})});if(!d.rejected)throw new Error('Evidence rejection did not complete');closeModal();toast('Irrelevant evidence rejected');await loadEvidence()}catch(e){toast(e.message)}}
function systemStatus(){return `<div class="pageHead"><div><h1>System Status</h1><p>Production readiness by component. Configured does not mean proven; each workflow must produce stored evidence and a visible change event.</p></div><button class="btn" onclick="loadSystemStatus()">Run Health Check</button></div><div id="systemStatus"><div class="card empty">Running production health checks…</div></div>`}
function statusColor(status){return ['WORKING','READY','OPERATIONAL'].includes(status)?'#18795a':['FAILED','NOT_CONFIGURED','NOT_READY'].includes(status)?'#b53b3b':'#9a6a12'}
async function loadSystemStatus(){const target=$('systemStatus');if(!target)return;target.innerHTML='<div class="card empty">Running production health checks…</div>';try{const d=await api('/api/system-status'),schema=(d.components||[]).find(x=>x.name==='Schema'),monitoring=(d.components||[]).find(x=>x.name==='Monitoring'),repair=schema?.missing?.length?`<div class="callout" style="margin-top:14px"><b>Database migration required</b><p class="muted">${schema.missing.length} V9.8.3 table(s) are missing. Initialization is repeatable and preserves existing records.</p><button class="btn dark" onclick="initializeSchema()">Initialize Missing Schema</button></div>`:'',monitorAction=!schema?.missing?.length&&monitoring?.status==='NOT_CONFIGURED'?`<div class="callout" style="margin-top:14px"><b>Start the first evidence workflow</b><p class="muted">Add one public retailer or category URL. Launchpad36 will save the target, run a live Firecrawl scrape, store attributable evidence, and create the first change event.</p><button class="btn dark" onclick="openMonitorSetup()">Add First Monitoring Target</button></div>`:'';target.innerHTML=`<div class="callout"><b>Overall: <span style="color:${statusColor(d.overall_status)}">${esc(d.overall_status)}</span></b><p class="muted">Version ${esc(d.version)} · Commit ${esc(String(d.commit).slice(0,12))} · Checked ${esc(new Date(d.checked_at).toLocaleString())}</p></div>${repair}${monitorAction}<div class="grid3" style="margin-top:14px">${(d.components||[]).map(x=>`<div class="card"><div class="label">${esc(x.name)}</div><h3 style="color:${statusColor(x.status)}">${esc(x.status)}</h3><p class="muted">${esc(x.detail)}</p>${x.missing?.length?`<p class="muted"><b>Missing:</b> ${esc(x.missing.join(', '))}</p>`:''}${x.last_check?`<p class="muted">Last check: ${esc(new Date(x.last_check).toLocaleString())}</p>`:''}</div>`).join('')}</div>`}catch(e){target.innerHTML=`<div class="card"><h3 style="color:#b53b3b">Health check failed</h3><p class="muted">${esc(e.message)}</p></div>`}}
async function initializeSchema(){if(!confirm('Initialize the missing V9.8.3 database schema? Existing records will be preserved.'))return;try{toast('Initializing database schema…');const d=await api('/api/db-init-v9-8',{method:'POST',body:'{}'});if(!d.initialized)throw new Error('Initialization did not complete');toast('Schema initialized');await loadSystemStatus()}catch(e){toast(e.message)}}
function openMonitorSetup(){$('modalCard').innerHTML=`<h2>Add First Monitoring Target</h2><p class="muted">Use a public retailer category or product-listing URL. Category is stored separately and enforced on every refresh. https:// is optional.</p><div class="formGrid"><div class="field full"><label>Public retailer or category URL</label><input id="monitorUrl" placeholder="retailer.com/category/tv-mounts"></div><div class="field"><label>Category</label><input id="monitorCategory" placeholder="TV mounts"></div><div class="field"><label>Evidence type</label><select id="monitorType"><option value="retailer_assortment">Retailer assortment</option><option value="retailer_company">Retailer company</option><option value="buyer_leadership">Buyer / leadership</option></select></div><div class="field"><label>Refresh cadence</label><select id="monitorTier"><option value="weekly">Weekly</option><option value="daily">Daily</option><option value="monthly">Monthly</option></select></div></div><div id="monitorResult" style="margin-top:12px"></div><div style="margin-top:15px"><button class="btn" onclick="saveAndRunMonitor()">Save & Run Live Scrape</button> <button class="btn secondary" onclick="closeModal()">Cancel</button></div>`;$('modal').classList.add('show')}
async function saveAndRunMonitor(){const url=$('monitorUrl').value.trim(),category=$('monitorCategory').value.trim(),result=$('monitorResult');if(!url||!category){toast('Enter a public URL and category');return}result.innerHTML='<div class="empty">Saving target and running the first live scrape…</div>';try{await api('/api/monitor-targets',{method:'POST',body:JSON.stringify({source_url:url,category_focus:category,target_type:$('monitorType').value,refresh_tier:$('monitorTier').value})});const run=await api('/api/living-intelligence-refresh',{method:'POST',body:JSON.stringify({limit:1})}),first=run.results?.[0];if(!first||first.status!=='SUCCESS')throw new Error(first?.error||'The live scrape did not complete');result.innerHTML=`<div class="callout"><b>First evidence workflow completed</b><p class="muted">Category: ${esc(category)} · Evidence status: ${esc(first.verification_status)} · Change detected: ${first.changed_since_last_check?'Yes':'No'}</p></div>`;toast('Live evidence stored');setTimeout(async()=>{closeModal();await loadSystemStatus()},1200)}catch(e){result.innerHTML=`<div class="callout"><b style="color:#b53b3b">Live scrape failed</b><p class="muted">${esc(e.message)}</p></div>`}}
function openAdmin(){if(state.auth){logout();return}$('modalCard').innerHTML=`<h2>Admin Unlock</h2><p class="muted">Controlled-build authentication. Production customer identity/RBAC comes before paid beta.</p><div class="field"><label>Admin secret</label><input id="secret" type="password"></div><div style="margin-top:15px"><button class="btn" onclick="unlock()">Unlock</button> <button class="btn secondary" onclick="closeModal()">Cancel</button></div>`;$('modal').classList.add('show')}
async function unlock(){try{await api('/api/session',{method:'POST',body:JSON.stringify({secret:$('secret').value})});state.auth=true;await load();closeModal();renderAuth();show('Dashboard');toast('Platform unlocked')}catch(e){toast(e.message)}}
async function logout(){try{await api('/api/session',{method:'DELETE'})}catch{}state.auth=false;state.portfolio={brands:[],products:[]};state.orgs=[];state.opps=[];renderAuth();show('Dashboard')}
function closeModal(){$('modal').classList.remove('show')}
function openBrand(){$('modalCard').innerHTML=`<h2>Add Brand</h2><div class="formGrid"><div class="field"><label>Brand Name</label><input id="brName"></div><div class="field"><label>Website</label><input id="brWeb" placeholder="https://"></div><div class="field full"><label>Description</label><textarea id="brDesc"></textarea></div></div><div style="margin-top:14px"><button class="btn" onclick="saveBrand()">Save Brand</button> <button class="btn secondary" onclick="closeModal()">Cancel</button></div>`;$('modal').classList.add('show')}
async function saveBrand(){try{await api('/api/brands',{method:'POST',body:JSON.stringify({name:$('brName').value,website:$('brWeb').value,description:$('brDesc').value})});await load();closeModal();render();toast('Brand saved')}catch(e){toast(e.message)}}
function openImport(){$('modalCard').innerHTML=`<h2>Import Product Catalog</h2><div class="seg"><button class="active" onclick="showImportTab('excel',this)">Excel / CSV</button><button onclick="showImportTab('web',this)">Vendor Website</button></div><div id="importBody" style="margin-top:14px">${excelImportHtml()}</div>`;$('modal').classList.add('show')}
function showImportTab(t,b){document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('importBody').innerHTML=t==='excel'?excelImportHtml():webImportHtml()}
function excelImportHtml(){return `<div class="uploadBox"><b>Upload .xlsx, .xls or .csv</b><p class="muted">Required columns: Brand, Product Name, SKU. Recommended: Product Family, Category, MSRP, MAP, Wholesale, UPC, Model Number, Features, Channels, Product URL, Image URL.</p><input type="file" id="catalogFile" accept=".xlsx,.xls,.csv"><div style="margin-top:12px"><button class="btn" onclick="parseCatalog()">Preview Import</button> <button class="btn secondary" onclick="loadDemoCatalog()">Load Demo Catalog — Aurelius Audio</button></div><p class="muted">Demo products are fictional and clearly marked <code>demo_data</code>. Nothing is saved until you approve the review.</p></div><div id="importPreview"></div>`}
function webImportHtml(){return `<div class="field"><label>Vendor / Brand Website (https:// optional)</label><input id="vendorUrl" placeholder="manufacturer.com"></div><div style="margin-top:12px"><button class="btn" onclick="discoverWebsite()">Discover Product Pages</button></div><div id="webPreview"></div>`}
let pendingRows=[],pendingReview=null,pendingSource={type:'excel',name:''};async function reviewCatalog(rows,type,name){pendingReview=null;pendingRows=[];$('importPreview').innerHTML='<div class="empty">Validating catalog for review…</div>';const d=await api('/api/catalog-import',{method:'POST',body:JSON.stringify({mode:'review',source_type:type,source_name:name,rows})});pendingRows=d.rows||[];pendingReview=d;pendingSource={type,name};$('importPreview').innerHTML=`<div class="callout" style="margin-top:14px"><b>${d.rows_valid} valid of ${d.rows_seen} rows · ${esc(d.status)}</b><p class="muted">Review the normalized records below. No products have been saved.</p>${d.errors?.length?`<div class="risk">${esc(JSON.stringify(d.errors.slice(0,10)))}</div>`:''}<pre style="white-space:pre-wrap;font-size:10px;max-height:360px;overflow:auto">${esc(JSON.stringify(pendingRows,null,2))}</pre><button class="btn dark" ${pendingRows.length?'':'disabled'} onclick="commitCatalog()">Approve & Import ${pendingRows.length} Rows</button></div>`}
async function parseCatalog(){const f=$('catalogFile').files[0];if(!f){toast('Choose a file');return}try{const buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:''});await reviewCatalog(rows,f.name.toLowerCase().endsWith('.csv')?'csv':'excel',f.name)}catch(e){toast(e.message)}}
async function loadDemoCatalog(){try{$('importPreview').innerHTML='<div class="empty">Loading fictional Aurelius Audio demo…</div>';const d=await api('/api/demo-catalog');await reviewCatalog(d.rows,'demo','Aurelius Audio fictional demo catalog')}catch(e){toast(e.message)}}
async function commitCatalog(){if(!pendingReview?.review_token){toast('Review the catalog first');return}try{const d=await api('/api/catalog-import',{method:'POST',body:JSON.stringify({approved:true,review_token:pendingReview.review_token,source_type:pendingSource.type,source_name:pendingSource.name,rows:pendingRows})});await load();closeModal();render();toast(`Imported ${d.rows_imported} approved ${d.source_type} rows`)}catch(e){toast(e.message)}}
async function discoverWebsite(){try{$('webPreview').innerHTML='<div class="empty">Discovering public product pages…</div>';const d=await api('/api/catalog-website',{method:'POST',body:JSON.stringify({website:$('vendorUrl').value,limit:40})});$('webPreview').innerHTML=`<div class="callout" style="margin-top:14px"><b>${esc(d.status)} · ${(d.candidates||[]).length} candidates</b><p class="muted">${esc(d.interpretation||'Review required before catalog ingestion.')}</p>${(d.candidates||[]).slice(0,20).map(x=>`<div class="item"><b>${esc(x.title||x.url)}</b><p>${esc(x.url)}</p></div>`).join('')}</div>`}catch(e){toast(e.message)}}
boot();
</script></body></html>
