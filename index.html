</style></head><body><div class="app"><aside class="side"><div class="brand"><img src="/logo.jpeg"><div><b>LAUNCHPAD36 AI</b><small>COMMERCIAL REVENUE INTELLIGENCE</small></div></div><div id="nav" class="nav"></div></aside><main class="main"><header class="top"><div><span class="statusDot"></span><b style="font-size:10px;letter-spacing:.08em">V9.8.3 LIVING INTELLIGENCE</b></div><div><button class="btn secondary" onclick="openAdmin()" id="authBtn">Admin Unlock</button></div></header><div class="content" id="content"></div></main></div><div id="modal" class="modal" role="dialog" aria-modal="true" onclick="if(event.target===this)closeModal()"><button class="modalClose" type="button" onclick="closeModal()" aria-label="Close dialog">×</button><div class="modalCard" id="modalCard"></div></div><div class="toast" id="toast"></div><script>
const NAV=['Dashboard','Find Me Revenue','Market Intelligence','Accounts','Products & Brands','Buyers','Opportunities','Evidence','System Status'];
const state={auth:false,portfolio:{brands:[],products:[]},orgs:[],opps:[],workspaces:[],marketOpportunity:null,buyers:[],selectedBuyerOrgId:'',evidence:[],pendingReview:0,session:null,screen:'Dashboard'};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('modal').classList.contains('show'))closeModal()});
async function api(url,o={}){const r=await fetch(url,{credentials:'same-origin',headers:{'content-type':'application/json',...(o.headers||{})},...o});const txt=await r.text();let d={};try{d=JSON.parse(txt)}catch{d={error:txt}}if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function nav(){ $('nav').innerHTML=NAV.map(n=>`<button class="${n===state.screen?'active':''}" onclick="show('${n}')">${n}</button>`).join('') }
function show(n){if(n!=='Dashboard'&&!state.auth){openAdmin();return}state.screen=n;nav();render();if(n==='System Status')loadSystemStatus();if(n==='Evidence')loadEvidence();if(n==='Buyers')loadBuyerAccount();if(n==='Opportunities')loadOpportunityWorkspaces()}
async function boot(){nav();try{const s=await api('/api/session');state.auth=!!s.authenticated;state.session=s}catch{}if(state.auth)await load();renderAuth();render()}
function renderAuth(){$('authBtn').textContent=state.auth?'Lock Session':'Admin Unlock';$('authBtn').onclick=state.auth?logout:openAdmin}
async function load(){try{const [portfolio,universe,workspaceData]=await Promise.all([api('/api/portfolio'),api('/api/account-universe?limit=500'),api('/api/opportunities').catch(()=>({opportunities:[]}))]);state.portfolio=portfolio;state.orgs=universe.organizations||[];state.workspaces=workspaceData.opportunities||[]}catch(e){toast(e.message)}}
function render(){const c=$('content');if(!state.auth){c.innerHTML=locked();return}const fn={'Dashboard':dashboard,'Find Me Revenue':findRevenue,'Market Intelligence':market,'Accounts':accounts,'Products & Brands':products,'Buyers':buyers,'Opportunities':opportunities,'Evidence':evidence,'System Status':systemStatus}[state.screen]||dashboard;c.innerHTML=fn()}
function locked(){return `<div class="hero"><div><div class="eyebrow">LAUNCHPAD36 AI V9.8.3</div><h1>Commercial revenue intelligence, built around your portfolio.</h1><p>Model retail, distributor, dealer, and direct B2B routes from private product data and source-tracked market evidence. Unlock the controlled build to continue.</p></div><button class="btn" onclick="openAdmin()">Unlock Platform</button></div>`}
function dashboard(){const p=state.portfolio.products||[],b=state.portfolio.brands||[],o=state.orgs||[];return `<div class="hero"><div><div class="eyebrow">EXECUTIVE REVENUE COMMAND CENTER</div><h1>From portfolio to market opportunity.</h1><p>Launchpad36 maps your brands and SKUs across routes to market, qualifies realistic accounts, and turns evidence-backed scenarios into commercial actions.</p></div><button class="btn" onclick="show('Find Me Revenue')">Find Me Revenue</button></div><div class="stats"><div class="card stat"><small>Brands</small><strong>${b.length}</strong><span class="muted">Tenant-owned portfolio</span></div><div class="card stat"><small>Products</small><strong>${p.length}</strong><span class="muted">Across product families</span></div><div class="card stat"><small>Searchable Accounts</small><strong>${o.length}</strong><span class="muted">Across commercial channels</span></div><div class="card stat"><small>Saved Opportunities</small><strong>${state.workspaces.length}</strong><span class="muted">Persistent action workspaces</span></div></div><div class="grid2"><div class="card"><h3>Revenue Intelligence Flow</h3><div class="funnel"><span>Portfolio</span><i>→</i><span>Market</span><i>→</i><span>Channel</span><i>→</i><span>Accounts</span><i>→</i><span>Buyers</span><i>→</i><span>Actions</span></div><p class="muted">Modeled scenarios remain separate from verified evidence and approved actions.</p></div><div class="callout"><b>Catalog onboarding</b><p class="muted">Upload Excel/CSV, discover products from a vendor website, or add items manually. Product imagery can be referenced from authoritative vendor URLs after review.</p><button class="btn ghost" onclick="show('Products & Brands')">Open Catalog</button></div></div>`}
function findRevenue(){const ps=state.portfolio.products||[];return `<div class="pageHead"><div><h1>Find Me Revenue</h1><p>Find accounts with a defensible product-category fit. General size or confidence alone can never qualify an account.</p></div></div><div class="card"><div class="toolbar"><select id="frProduct"><option value="">Choose product</option>${ps.map(p=>`<option value="${p.id}">${esc(p.brand_name||'')} — ${esc(p.name)}</option>`).join('')}</select><select id="frLimit"><option>25</option><option>50</option><option selected>100</option><option>250</option></select><button class="btn" onclick="runFindRevenue()">Rank Qualified Accounts</button></div><div id="frResults">${renderOpps()}</div></div>`}
function buyerContactSummary(rows=[]){if(!rows.length)return '<span class="muted">No saved buyer contact</span>';const b=rows[0],links=[b.email?`<a href="mailto:${esc(b.email)}">${esc(b.email)}</a>`:'',b.phone?`<a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>`:'',b.linkedin?`<a href="${esc(b.linkedin)}" target="_blank" rel="noopener noreferrer">LinkedIn</a>`:''].filter(Boolean);return `<b>${esc(b.name)}</b><div class="muted">${esc(b.title||b.category||'')}</div>${links.length?`<div class="muted">${links.join(' · ')}</div>`:'<div class="muted">Role found; direct contact unavailable</div>'}${rows.length>1?`<div class="muted">+${rows.length-1} more saved</div>`:''}`}
function renderOpps(){if(!state.opps.length)return `<div class="empty">Choose a product and rank the account universe. Incompatible accounts are excluded; viable research candidates are labeled separately from verified accounts.</div>`;return `<div class="tableWrap"><table class="table"><thead><tr><th>Account</th><th>Fit</th><th>Why It Fits</th><th>Evidence Tier</th><th>Buyer Contact</th><th>Action</th></tr></thead><tbody>${state.opps.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.domain||'')}</div></td><td><span class="score">${x.fit_score}</span><div class="muted">${esc(x.fit_tier||'')}</div></td><td class="muted">${esc(x.fit_reason||'Qualified category match')}</td><td><span class="${x.evidence_status==='VERIFIED'?'evidenceVerified':'evidenceNeeded'}">${esc(x.evidence_status||'INSUFFICIENT').replaceAll('_',' ')}</span><div class="muted">${Number(x.evidence_count)||0} product observation(s)</div></td><td>${buyerContactSummary(x.buyers||[])}</td><td><button class="btn ghost" onclick="openAccountResearch('${esc(x.organization_id||x.id)}')">Research Account</button></td></tr>`).join('')}</tbody></table></div>`}
async function runFindRevenue(){const product_id=$('frProduct').value;if(!product_id){toast('Choose a product');return}try{const d=await api('/api/find-me-revenue',{method:'POST',body:JSON.stringify({product_id,limit:Number($('frLimit').value)})});state.opps=d.opportunities||[];$('frResults').innerHTML=renderOpps();toast(`Ranked ${state.opps.length} accounts`)}catch(e){toast(e.message)}}
function market(){const ps=state.portfolio.products||[];return `<div class="pageHead"><div><h1>Market Opportunity Scenarios</h1><p>Model an addressable manufacturer-revenue scenario across multiple products, then distinguish qualified account fit from verified assortment evidence.</p></div><span class="sourceTag">MODELED · NOT A FORECAST</span></div><div class="grid2"><div class="card"><div class="label">1 · SELECT PRODUCTS</div><div class="toolbar" style="margin-top:10px"><button class="btn ghost" onclick="toggleMarketProducts(true)">Select All</button><button class="btn secondary" onclick="toggleMarketProducts(false)">Clear</button></div><div class="productPicker">${ps.map(p=>`<label class="productChoice"><input class="moProduct" type="checkbox" value="${esc(p.id)}"><span><b>${esc(p.brand_name||'')} · ${esc(p.name)}</b><span class="muted" style="display:block">${esc(p.product_family||p.category||'Uncategorized')} · ${(p.variants||[]).length} SKU(s)</span></span></label>`).join('')||'<div class="empty">Import products before modeling market opportunity.</div>'}</div></div><div class="card"><div class="label">2 · ROUTE & ASSUMPTIONS</div><div class="field" style="margin-top:10px"><label>Route to market</label><select id="moRoute" onchange="updateMarketFields()"><option value="retail">Retail</option><option value="direct_b2b">Direct B2B</option><option value="distributor_dealer">Distributor / Dealer</option><option value="mixed">Mixed Channels</option></select></div><div class="assumptionGrid" style="margin-top:10px"><div class="field"><label id="moUnitsLabel">Annual units per location, per SKU</label><input id="moUnits" type="number" min="0" value="12"></div><div class="field"><label id="moProbabilityLabel">Distribution probability (%)</label><input id="moProbability" type="number" min="0" max="100" value="25"></div><div class="field"><label>Portfolio overlap discount (%)</label><input id="moOverlap" type="number" min="0" max="100" value="10"></div><div class="field"><label>Scenario range</label><input value="65% low · 135% high" disabled></div></div><p class="muted">Catalog wholesale price is used when available. Otherwise the scenario flags a 60%-of-MSRP estimate. Calculated accounts are saved to Opportunities.</p><button class="btn dark" onclick="runMarketOpportunity()">Calculate & Save Scenario</button></div></div><div id="marketResults" style="margin-top:15px">${renderMarketResults()}</div>`}
function toggleMarketProducts(checked){document.querySelectorAll('.moProduct').forEach(x=>x.checked=checked)}
function updateMarketFields(){const retail=$('moRoute')?.value==='retail';if($('moUnitsLabel'))$('moUnitsLabel').textContent=retail?'Annual units per location, per SKU':'Units per account, per SKU';if($('moProbabilityLabel'))$('moProbabilityLabel').textContent=retail?'Distribution probability (%)':'Win probability (%)'}
const fmtMoney=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)||0);
async function runMarketOpportunity(){const product_ids=[...document.querySelectorAll('.moProduct:checked')].map(x=>x.value);if(!product_ids.length){toast('Select at least one product');return}const route=$('moRoute').value,units=Number($('moUnits').value),probability=Number($('moProbability').value),assumptions={portfolio_overlap_discount:Number($('moOverlap').value),low_multiplier:.65,high_multiplier:1.35};if(route==='retail'){assumptions.annual_units_per_location=units;assumptions.distribution_probability=probability}else{assumptions.units_per_account=units;assumptions.win_probability=probability}const target=$('marketResults');target.innerHTML='<div class="card empty">Qualifying accounts, calculating the scenario, and saving workspaces…</div>';try{state.marketOpportunity=await api('/api/market-opportunity',{method:'POST',body:JSON.stringify({product_ids,route_to_market:route,assumptions})});target.innerHTML=renderMarketResults();target.insertAdjacentHTML('afterbegin','<div class="toolbar" style="justify-content:flex-end"><button class="btn" onclick="openMarketReport()">Export / Email Full Analysis</button></div>');if(state.marketOpportunity.persistence_status==='SAVED')await loadOpportunityWorkspaces(false);toast(state.marketOpportunity.persistence_status==='SAVED'?`Saved ${state.marketOpportunity.summary.target_account_count} account scenario(s)`:`Calculated ${state.marketOpportunity.summary.target_account_count} accounts; initialize schema to save them`)}catch(e){target.innerHTML=`<div class="card"><h3 style="color:#b53b3b">Opportunity could not be calculated</h3><p class="muted">${esc(e.message)}</p></div>`}}
function renderMarketResults(){const d=state.marketOpportunity;if(!d)return `<div class="card empty">Select one or more products and calculate a modeled, assumption-backed scenario.</div>`;const s=d.summary||{},a=d.assumptions||{},rows=d.account_opportunities||[];return `<div class="resultHero"><div class="label" style="color:#85b5ff">MODELED ADDRESSABLE SCENARIO · NOT A FORECAST</div><div class="stats"><div class="card stat"><small>Low Scenario</small><strong>${fmtMoney(s.low_manufacturer_revenue)}</strong><span class="muted">65% of base assumptions</span></div><div class="card stat"><small>Base Scenario</small><strong>${fmtMoney(s.base_manufacturer_revenue)}</strong><span class="muted">Assumption-backed wholesale revenue</span></div><div class="card stat"><small>High Scenario</small><strong>${fmtMoney(s.high_manufacturer_revenue)}</strong><span class="muted">135% of base assumptions</span></div><div class="card stat"><small>Evidence-Backed Portion</small><strong>${fmtMoney(s.evidence_backed_manufacturer_revenue)}</strong><span class="muted">Only accounts with verified assortment evidence</span></div></div></div><div class="stats"><div class="card stat"><small>Selected Products</small><strong>${s.selected_product_count||0}</strong></div><div class="card stat"><small>Priced SKUs</small><strong>${s.priced_sku_count||0}</strong></div><div class="card stat"><small>Qualified Accounts</small><strong>${s.target_account_count||0}</strong></div><div class="card stat"><small>Verified Evidence Coverage</small><strong>${s.account_category_coverage||0}%</strong><span class="muted">${s.verified_account_count||0} verified account(s)</span></div></div><div class="grid2"><div class="card"><h3>Qualified Account Scenarios</h3><div class="tableWrap"><table class="table"><thead><tr><th>Account</th><th>Fit</th><th>Evidence</th><th>Modeled Base</th><th>Evidence-Backed</th><th>Next Step</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.domain||'')}</div></td><td><span class="score">${Number(x.fit_score)||0}</span><div class="muted">${esc(x.fit_reason)}</div></td><td><span class="${x.evidence_status==='VERIFIED'?'evidenceVerified':'evidenceNeeded'}">${esc(x.evidence_status||'INSUFFICIENT')}</span><div class="muted">${Number(x.evidence_count)||0} observation(s)</div></td><td><b>${fmtMoney(x.base_manufacturer_revenue)}</b></td><td><b>${fmtMoney(x.evidence_backed_manufacturer_revenue)}</b></td><td><button class="btn ghost" onclick="openMarketAccount(${i})">Review Scenario</button></td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">No accounts have a defensible category fit for the selected products. Incompatible and unprofiled accounts are excluded.</div>'}</div></div><div class="card"><h3>Scenario Inputs</h3><div class="item"><b>Route: ${esc(String(a.route_to_market||'').replaceAll('_',' '))}</b><p>${a.route_to_market==='retail'?`${a.annual_units_per_location} annual units/location/SKU · ${a.distribution_probability}% distribution probability`:`${a.units_per_account} units/account/SKU · ${a.win_probability}% win probability`} · ${a.portfolio_overlap_discount}% overlap discount.</p><span class="sourceTag">${esc(a.provenance)}</span></div>${(d.category_totals||[]).map(x=>`<div class="item"><b>${esc(x.category)}</b><p>${fmtMoney(x.base_manufacturer_revenue)} modeled manufacturer revenue</p></div>`).join('')}${(d.warnings||[]).map(x=>`<div class="warning">${esc(x)}</div>`).join('')}<button class="btn" onclick="show('Opportunities')">Open Saved Workspaces</button></div></div>`}
function openMarketAccount(index){const d=state.marketOpportunity,x=d?.account_opportunities?.[index];if(!x)return;$('modalCard').innerHTML=`<h2>${esc(x.name)} Scenario</h2><p class="muted">Modeled range: ${fmtMoney(x.low_manufacturer_revenue)} low · <b>${fmtMoney(x.base_manufacturer_revenue)} base</b> · ${fmtMoney(x.high_manufacturer_revenue)} high. Evidence-backed portion: <b>${fmtMoney(x.evidence_backed_manufacturer_revenue)}</b>.</p><div class="callout"><b>Qualification: ${esc(x.fit_reason)}</b><p class="muted">Evidence tier: ${esc(x.evidence_status||'INSUFFICIENT').replaceAll('_',' ')} · ${Number(x.evidence_count)||0} product observation(s)${x.last_verified_at?` · last verified ${esc(new Date(x.last_verified_at).toLocaleDateString())}`:x.last_observed_at?` · last observed ${esc(new Date(x.last_observed_at).toLocaleDateString())}`:''}.</p></div><div class="item"><b>Saved buyer contact</b><p>${buyerContactSummary(x.buyers||[])}</p></div><div class="tableWrap"><table class="table"><thead><tr><th>Product</th><th>SKU</th><th>Fit</th><th>Evidence</th><th>Wholesale</th><th>Price Source</th><th>Modeled Contribution</th></tr></thead><tbody>${(x.product_contributions||[]).map(p=>`<tr><td><b>${esc(p.brand_name)} · ${esc(p.product_name)}</b><div class="muted">${esc(p.fit_reason)}</div></td><td>${esc(p.sku)}</td><td>${Number(p.fit_score)||0}</td><td>${esc(p.evidence_status||'INSUFFICIENT').replaceAll('_',' ')}</td><td>${fmtMoney(p.wholesale)}</td><td><span class="sourceTag">${esc(p.wholesale_source)}</span></td><td><b>${fmtMoney(p.base_manufacturer_revenue)}</b></td></tr>`).join('')}</tbody></table></div><div style="margin-top:15px">${x.evidence_status==='VERIFIED'?'<button class="btn" onclick="closeModal();show(\'Opportunities\')">Open Workspace</button>':`<button class="btn dark" onclick="closeModal();openAccountResearch('${esc(x.organization_id)}')">Research Products at Account</button>`} <button class="btn secondary" onclick="closeModal()">Close</button></div>`;$('modal').classList.add('show')}

function marketReportDefaults(){const d=state.marketOpportunity,s=d.summary||{},products=d.selected_products||[],top=(d.account_opportunities||[]).slice(0,5).map(x=>x.name).join(', ');return {title:'Full Market Analysis',subject:`Launchpad36 Market Analysis — ${products.map(x=>x.name).slice(0,3).join(', ')||'Selected Products'}`,summary:`This analysis models ${fmtMoney(s.base_manufacturer_revenue)} in base manufacturer revenue across ${s.target_account_count||0} qualified accounts for ${products.length||s.selected_product_count||0} selected products. ${s.verified_account_count||0} accounts currently have verified assortment evidence.`,recommendations:`Prioritize the highest-fit accounts${top?`: ${top}`:''}. Validate assortment evidence and buyer ownership before outreach, then refine assumptions using actual sell-in results.`}}
function openMarketReport(){if(!state.marketOpportunity){toast('Calculate a market scenario first');return}const x=marketReportDefaults();$('modalCard').innerHTML=`<h2>Export & Email Full Market Analysis</h2><p class="muted">Review and customize the narrative before downloading or sending. The tables remain tied to the selected products and calculated scenario.</p><div class="reportEditor"><div><div class="field"><label>Report title</label><input id="reportTitle" value="${esc(x.title)}"></div><div class="field"><label>Executive summary</label><textarea id="reportSummary" rows="7">${esc(x.summary)}</textarea></div><div class="field"><label>Recommendations</label><textarea id="reportRecommendations" rows="7">${esc(x.recommendations)}</textarea></div><div class="field"><label>Recipients (comma separated)</label><input id="reportTo" type="email" multiple placeholder="name@company.com"></div><div class="field"><label>Email subject</label><input id="reportSubject" value="${esc(x.subject)}"></div><div class="field"><label>Personal message</label><textarea id="reportMessage" rows="4" placeholder="Optional note shown above the analysis"></textarea></div><div class="workspaceActions" style="margin-top:12px"><button class="btn ghost" onclick="refreshMarketReportPreview()">Update Preview</button><button class="btn secondary" onclick="downloadMarketReport()">Download HTML</button><button class="btn secondary" onclick="openMarketReportEmailApp()">Open Email App</button><button class="btn" id="sendReportBtn" onclick="sendMarketReport()">Send Report</button></div></div><div class="reportPreview" id="reportPreview"></div></div>`;$('modal').classList.add('show');refreshMarketReportPreview()}
function reportValue(id,fallback=''){return $(id)?.value?.trim()||fallback}
function buildMarketReportHtml(){const d=state.marketOpportunity||{},s=d.summary||{},a=d.assumptions||{},products=d.selected_products||[],accounts=d.account_opportunities||[],title=reportValue('reportTitle','Full Market Analysis'),summary=reportValue('reportSummary'),recommendations=reportValue('reportRecommendations'),message=reportValue('reportMessage');const rows=accounts.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span style="color:#71869e">${esc(x.domain||'')}</span></td><td>${Number(x.fit_score)||0}<br><span style="color:#71869e">${esc(x.fit_reason||'')}</span></td><td>${esc(String(x.evidence_status||'INSUFFICIENT').replaceAll('_',' '))}</td><td>${fmtMoney(x.base_manufacturer_revenue)}</td><td>${(x.buyers||[]).map(b=>`${esc(b.name)} — ${esc(b.title||b.category||'')}${b.email?` (${esc(b.email)})`:''}`).join('<br>')||'Not available'}</td></tr>`).join('');return `<!doctype html><html><body style="margin:0;background:#f5f8fc;color:#14283f;font-family:Arial,sans-serif"><div style="max-width:1000px;margin:auto;padding:28px"><div style="background:#08224b;color:white;padding:26px;border-radius:16px"><div style="font-size:11px;letter-spacing:1.5px;color:#85b5ff">LAUNCHPAD36 AI</div><h1 style="margin:8px 0">${esc(title)}</h1><div>Generated ${esc(new Date().toLocaleString())} · Modeled analysis, not a forecast</div></div>${message?`<p style="padding:16px;background:white;border-radius:12px">${esc(message).replaceAll('\n','<br>')}</p>`:''}<h2>Executive Summary</h2><p>${esc(summary).replaceAll('\n','<br>')}</p><div style="display:flex;gap:10px;flex-wrap:wrap">${[['Low',s.low_manufacturer_revenue],['Base',s.base_manufacturer_revenue],['High',s.high_manufacturer_revenue],['Evidence-backed',s.evidence_backed_manufacturer_revenue]].map(([k,v])=>`<div style="flex:1;min-width:150px;background:white;padding:14px;border:1px solid #dce7f2;border-radius:12px"><small>${k}</small><div style="font-size:22px;font-weight:bold">${fmtMoney(v)}</div></div>`).join('')}</div><h2>Selected Products</h2><ul>${products.map(p=>`<li><b>${esc(p.brand_name)} ${esc(p.name)}</b> — ${esc(p.category||p.product_family||'Uncategorized')} · ${(p.skus||[]).length} SKU(s)</li>`).join('')}</ul><h2>Model Assumptions</h2><p>Route: ${esc(String(a.route_to_market||'').replaceAll('_',' '))}; ${a.route_to_market==='retail'?`${a.annual_units_per_location} annual units/location/SKU at ${a.distribution_probability}% distribution`:`${a.units_per_account} units/account/SKU at ${a.win_probability}% win probability`}; ${a.portfolio_overlap_discount}% portfolio overlap discount.</p><h2>Account Opportunity</h2><table style="width:100%;border-collapse:collapse;background:white;font-size:12px"><thead><tr><th style="text-align:left;padding:9px;border-bottom:1px solid #dce7f2">Account</th><th style="text-align:left;padding:9px;border-bottom:1px solid #dce7f2">Fit</th><th style="text-align:left;padding:9px;border-bottom:1px solid #dce7f2">Evidence</th><th style="text-align:left;padding:9px;border-bottom:1px solid #dce7f2">Modeled Base</th><th style="text-align:left;padding:9px;border-bottom:1px solid #dce7f2">Buyer</th></tr></thead><tbody>${rows}</tbody></table><h2>Recommendations</h2><p>${esc(recommendations).replaceAll('\n','<br>')}</p><h2>Method & Limitations</h2><ul>${(d.warnings||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></body></html>`}
function refreshMarketReportPreview(){$('reportPreview').innerHTML=`<div>${buildMarketReportHtml().replace(/^.*?<body[^>]*>|<\/body>.*$/gs,'')}</div>`}
function downloadMarketReport(){const html=buildMarketReportHtml(),link=document.createElement('a');link.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));link.download='launchpad36-market-analysis.html';link.click();URL.revokeObjectURL(link.href)}
function openMarketReportEmailApp(){const d=state.marketOpportunity,s=d.summary||{},subject=reportValue('reportSubject','Launchpad36 Market Analysis'),body=`${reportValue('reportMessage')}\n\n${reportValue('reportSummary')}\n\nSelected products: ${(d.selected_products||[]).map(x=>`${x.brand_name} ${x.name}`).join(', ')}\nQualified accounts: ${s.target_account_count||0}\nBase modeled opportunity: ${fmtMoney(s.base_manufacturer_revenue)}\n\n${reportValue('reportRecommendations')}\n\nDownload and attach the full HTML report for complete account-level detail.`;location.href=`mailto:${encodeURIComponent(reportValue('reportTo'))}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`}
async function sendMarketReport(){const button=$('sendReportBtn');button.disabled=true;button.textContent='Sending…';try{const d=await api('/api/market-report-email',{method:'POST',body:JSON.stringify({to:reportValue('reportTo'),subject:reportValue('reportSubject'),html:buildMarketReportHtml()})});toast(`Report sent to ${d.recipients} recipient(s)`);closeModal()}catch(e){toast(e.message)}finally{if(button){button.disabled=false;button.textContent='Send Report'}}}
function channel(){const orgs=state.orgs||[];const ch={};for(const o of orgs)for(const c of(o.channel_codes||[]))ch[c]=(ch[c]||0)+1;const top=Object.entries(ch).sort((a,b)=>b[1]-a[1]);return `<div class="pageHead"><div><h1>Channel Intelligence</h1><p>Compare channel reach and whitespace across the full account universe—not one retailer at a time.</p></div></div><div class="grid3">${top.map(([k,v])=>`<div class="card"><div class="label">CHANNEL</div><h3>${esc(k.replaceAll('_',' '))}</h3><div class="metric"><b>${v}</b><small class="muted">searchable organizations</small></div></div>`).join('')||'<div class="card empty">No channel universe loaded yet.</div>'}</div>`}
function accounts(){return `<div class="pageHead"><div><div class="eyebrow">ACCOUNT INTELLIGENCE</div><h1>Account Universe</h1><p>Research retailers, distributors, dealers, buyers and product assortment from one account workspace.</p></div><div><button id="retailerDiscoveryBtn" class="btn dark" onclick="runRetailerDiscovery()">Discover New Retailers</button> <button class="btn secondary" onclick="downloadAccountTemplate()">Download Template</button> <button class="btn secondary" onclick="openAddAccount()">Add Account</button> <button class="btn" onclick="openAccountImport()">Import Accounts</button></div></div><div class="callout" style="margin-bottom:14px"><b>Weekly Retailer Intelligence Agent</b><p class="muted">Runs every Monday, uses active portfolio categories to find relevant U.S. retail accounts, and adds attributable results as discovery candidates for review.</p></div><div class="card"><div class="toolbar"><input id="acctQ" placeholder="Search account, retailer, distributor or domain"><select id="acctChannel"><option value="">All channels</option><option value="mass">Mass Retail</option><option value="ce">Consumer Electronics</option><option value="consumer_electronics">CE Distribution</option><option value="ecommerce">E-commerce</option><option value="distribution">Distribution</option><option value="specialty_av">Specialty AV</option><option value="office">Office</option><option value="furniture">Furniture</option><option value="automotive">Automotive</option><option value="appliances">Appliances</option></select><button class="btn" onclick="searchAccounts()">Search Accounts</button></div><div id="accountResults">${accountTable(state.orgs)}</div></div>`}
function accountTable(rows){return `<div class="tableWrap"><table class="table"><thead><tr><th>Organization</th><th>Head Office</th><th>Business Channels</th><th>Categories</th><th>Locations</th><th>Buyer Contact</th><th>Intelligence</th></tr></thead><tbody>${(rows||[]).map(o=>{const buyer=(o.buyers||[])[0];return `<tr><td><b>${esc(o.name)}</b><div class="muted">${esc(o.organization_type||'retailer')} · ${esc(o.domain||'')}</div><span class="sourceTag">${esc((o.verification_status||'DISCOVERY_CANDIDATE').replaceAll('_',' '))}</span></td><td>${esc(o.headquarters||o.region||'Not researched')}</td><td>${(o.channel_codes||[]).slice(0,4).map(c=>`<span class="badge">${esc(c.replaceAll('_',' '))}</span>`).join(' ')}</td><td>${(o.categories||[]).slice(0,4).map(c=>`<span class="pill">${esc(c)}</span>`).join(' ')}</td><td>${Number(o.footprint)||'—'}</td><td>${buyer?`<b>${esc(buyer.name)}</b><div class="muted">${esc(buyer.title||buyer.category||'')}${buyer.email?`<br><a href="mailto:${esc(buyer.email)}">${esc(buyer.email)}</a>`:''}${buyer.phone?`<br><a href="tel:${esc(buyer.phone)}">${esc(buyer.phone)}</a>`:''}</div>`:'<span class="muted">Not researched</span>'}</td><td><div class="workspaceActions"><button class="btn ghost" onclick="openAccountResearch('${esc(o.id)}')">Research</button><button class="btn secondary" onclick="openAccountChannel('${esc(o.id)}')">Channel Intelligence</button><button class="btn secondary" onclick="openEditAccount('${esc(o.id)}')">Edit</button></div></td></tr>`}).join('')}</tbody></table>${rows?.length?'':'<div class="empty"><b>No accounts loaded.</b><p>Import an Excel/CSV account list or add the first account manually.</p><button class="btn" onclick="openAccountImport()">Import Accounts</button></div>'}</div>`}
function openAccountChannel(orgId){const o=(state.orgs||[]).find(x=>String(x.id)===String(orgId));if(!o)return;$('modalCard').innerHTML=`<div class="eyebrow">ACCOUNT CHANNEL INTELLIGENCE</div><h2>${esc(o.name)}</h2><div class="stats"><div class="card stat"><small>Head Office</small><strong style="font-size:16px">${esc(o.headquarters||o.region||'Not researched')}</strong></div><div class="card stat"><small>Locations</small><strong>${Number(o.footprint)||'—'}</strong></div><div class="card stat"><small>Saved Buyers</small><strong>${Number(o.buyer_count)||0}</strong></div><div class="card stat"><small>Confidence</small><strong>${Number(o.confidence)||0}%</strong></div></div><div class="grid2"><div class="card"><h3>Business Channels</h3>${(o.channel_codes||[]).map(x=>`<span class="badge">${esc(x.replaceAll('_',' '))}</span>`).join(' ')||'<p class="muted">No channels profiled.</p>'}</div><div class="card"><h3>Product Categories</h3>${(o.categories||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join(' ')||'<p class="muted">No categories profiled.</p>'}</div></div><h3>Buyer Contacts</h3>${(o.buyers||[]).length?buyerTableHtml(o.buyers):'<div class="empty">No buyer contacts saved yet.</div>'}<div class="workspaceActions" style="margin-top:14px"><button class="btn" onclick="closeModal();openAccountResearch('${esc(o.id)}')">Research Account</button><button class="btn secondary" onclick="closeModal()">Close</button></div>`;$('modal').classList.add('show')}
function openEditAccount(orgId){const o=(state.orgs||[]).find(x=>String(x.id)===String(orgId));if(!o){toast('Account not found');return}$('modalCard').innerHTML=`<div class="eyebrow">ACCOUNT MANAGEMENT</div><h2>Edit ${esc(o.name)}</h2><p class="muted">Corrections keep the existing account ID, saved buyers, and research evidence connected.</p><div class="formGrid"><div class="field"><label>Organization</label><input id="eaName" value="${esc(o.name)}"></div><div class="field"><label>Domain</label><input id="eaDomain" value="${esc(o.domain||'')}" placeholder="retailer.com"></div><div class="field"><label>Head Office</label><input id="eaHeadquarters" value="${esc(o.headquarters||'')}" placeholder="City, State"></div><div class="field"><label>Type</label><select id="eaType"><option value="retailer">Retailer</option><option value="distributor">Distributor</option><option value="dealer">Dealer</option><option value="enterprise">Direct B2B</option></select></div><div class="field"><label>Coverage</label><input id="eaCoverage" value="${esc(o.coverage||'')}"></div><div class="field"><label>Region</label><input id="eaRegion" value="${esc(o.region||'')}"></div><div class="field"><label>Locations / Footprint</label><input id="eaFootprint" type="number" min="0" value="${Number(o.footprint)||0}"></div><div class="field"><label>Channels</label><input id="eaChannels" value="${esc((o.channel_codes||[]).join(', '))}"></div><div class="field full"><label>Categories</label><input id="eaCategories" value="${esc((o.categories||[]).join(', '))}"></div><div class="field full"><label>Evidence source (https:// optional)</label><input id="eaSource" value="${esc(o.source_url||'')}"></div></div><div class="workspaceActions" style="margin-top:15px"><button id="editAccountBtn" class="btn" onclick="saveAccountEdits('${esc(o.id)}')">Save Changes</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`;$('eaType').value=o.organization_type||'retailer';$('modal').classList.add('show')}
async function saveAccountEdits(orgId){const button=$('editAccountBtn'),existing=(state.orgs||[]).find(x=>String(x.id)===String(orgId))||{},payload={id:orgId,name:$('eaName').value.trim(),domain:$('eaDomain').value.trim(),headquarters:$('eaHeadquarters').value.trim(),organization_type:$('eaType').value,coverage:$('eaCoverage').value.trim(),region:$('eaRegion').value.trim(),footprint:Number($('eaFootprint').value)||0,channels:$('eaChannels').value,categories:$('eaCategories').value,ecommerce:Boolean(existing.ecommerce),source_url:$('eaSource').value.trim()};if(!payload.name){toast('Organization is required');return}button.disabled=true;button.textContent='Saving…';try{await api('/api/account-universe',{method:'PATCH',body:JSON.stringify(payload)});await load();closeModal();show('Accounts');toast('Account updated')}catch(e){toast(e.message);button.disabled=false;button.textContent='Save Changes'}}
async function searchAccounts(){try{const q=encodeURIComponent($('acctQ').value||''),ch=encodeURIComponent($('acctChannel').value||'');const d=await api(`/api/account-universe?q=${q}&channel=${ch}&limit=500`);$('accountResults').innerHTML=accountTable(d.organizations||[])}catch(e){toast(e.message)}}

function renderOpportunityWorkspaces(){if(!state.workspaces.length)return `<div class="card empty"><b>No target accounts yet.</b><p>Add an account directly or build a multi-product scenario in Market Intelligence.</p><button class="btn" onclick="openAddTargetAccount()">Add Target Account</button> <button class="btn secondary" onclick="show('Market Intelligence')">Build Scenario</button></div>`;return `<div class="workspaceGrid">${state.workspaces.map(w=>{const scenario=w.scenario||{},account=scenario.account||{},sku=scenario.recommended_sku||{},verified=account.evidence_status==='VERIFIED',buyers=w.buyers||[];return `<article class="card workspaceCard"><div class="workspaceTop"><div><div class="label">${esc(String(w.route_to_market||'').replaceAll('_',' '))} · ${esc(w.priority||'medium')} priority</div><h3 style="margin:5px 0">${esc(w.account_name)}</h3><div class="muted">${esc(w.domain||'')} · Updated ${w.updated_at?esc(new Date(w.updated_at).toLocaleDateString()):'—'}</div></div><span class="${verified?'evidenceVerified':'evidenceNeeded'}">${esc(w.status||'research_required').replaceAll('_',' ')}</span></div><div class="metricGrid"><div class="metric"><small class="muted">Modeled Base</small><b>${fmtMoney(account.base_manufacturer_revenue)}</b></div><div class="metric"><small class="muted">Evidence-Backed</small><b>${fmtMoney(account.evidence_backed_manufacturer_revenue)}</b></div><div class="metric"><small class="muted">Fit</small><b>${Number(account.fit_score)||0}</b></div><div class="metric"><small class="muted">Saved Buyers</small><b>${Number(w.buyer_count)||0}</b></div></div><div class="item"><b>${esc(sku.brand_name||'')} ${esc(sku.product_name||'Selected portfolio')}</b><p>${sku.sku?`Recommended SKU: ${esc(sku.sku)} · `:''}${esc(account.fit_reason||sku.fit_reason||'Qualified category fit')}</p><span class="${verified?'evidenceVerified':'evidenceNeeded'}">${verified?`${Number(account.evidence_count)||0} verified evidence record(s)`:'Product evidence required before approval'}</span></div>${buyers.length?`<div class="item"><b>Account buyer data</b><p>${buyers.slice(0,3).map(b=>`${esc(b.name)} — ${esc(b.title||b.category||'')}`).join('<br>')}</p></div>`:''}<div class="workspaceFields"><div class="field"><label>Owner</label><input id="owner-${esc(w.id)}" value="${esc(w.owner||'')}" placeholder="Assign owner"></div><div class="field"><label>Next action</label><input id="action-${esc(w.id)}" value="${esc(w.next_action||'')}" placeholder="Next commercial action"></div></div><div class="workspaceActions"><button class="btn secondary" onclick="saveOpportunityWorkspace('${esc(w.id)}','${esc(w.status)}')">Save</button>${verified&&w.status!=='approved'?`<button class="btn" onclick="saveOpportunityWorkspace('${esc(w.id)}','approved')">Approve Opportunity</button>`:''}<button class="btn dark" onclick="openAccountResearch('${esc(w.organization_id)}')">Research Account</button><button class="btn ghost" onclick="openOpportunityWorkspace('${esc(w.id)}')">Compare Assortment</button><button class="btn danger" onclick="removeTargetAccount('${esc(w.id)}','${esc(w.account_name)}')">Remove Target</button></div></article>`}).join('')}</div>`}
async function loadOpportunityWorkspaces(renderTarget=true){try{const d=await api('/api/opportunities');state.workspaces=d.opportunities||[];if(renderTarget&&$('opportunityResults'))$('opportunityResults').innerHTML=renderOpportunityWorkspaces()}catch(e){if($('opportunityResults'))$('opportunityResults').innerHTML=`<div class="card"><h3 style="color:#b53b3b">Workspaces could not be loaded</h3><p class="muted">${esc(e.message)}</p></div>`;else toast(e.message)}}
function openAddTargetAccount(){$('modalCard').classList.remove('accountResearchModal');$('modalCard').innerHTML=`<h2>Add Target Account</h2><p class="muted">Choose an account and the portfolio products you want to pursue. This creates a research-required target without claiming that the account already carries or will buy the products.</p><div class="formGrid"><div class="field"><label>Target account</label><select id="targetAccount">${orgOptions()}</select></div><div class="field"><label>Route to market</label><select id="targetRoute"><option value="retail">Retail</option><option value="distributor_dealer">Distributor / Dealer</option><option value="direct_b2b">Direct B2B</option><option value="mixed">Mixed</option></select></div><div class="field full"><label>Products to propose</label><div class="targetProductList">${(state.portfolio.products||[]).map(p=>`<label class="targetProductOption"><input type="checkbox" class="targetProduct" value="${esc(p.id)}"><span><b>${esc(p.brand_name||'')} · ${esc(p.name)}</b><br><span class="muted">${esc(p.category||p.product_family||'Uncategorized')}</span></span></label>`).join('')||'<div class="empty">Add portfolio products before creating a target.</div>'}</div></div></div><div class="workspaceActions" style="margin-top:15px"><button id="createTargetBtn" class="btn" onclick="createTargetAccount()">Add to Opportunities</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`;$('modal').classList.add('show')}
async function createTargetAccount(){const button=$('createTargetBtn'),organization_id=$('targetAccount')?.value,product_ids=[...document.querySelectorAll('.targetProduct:checked')].map(x=>x.value);if(!organization_id){toast('Choose a target account');return}if(!product_ids.length){toast('Select at least one portfolio product');return}button.disabled=true;button.textContent='Adding Target…';try{await api('/api/opportunities',{method:'POST',body:JSON.stringify({action:'create',organization_id,route_to_market:$('targetRoute').value,product_ids})});await loadOpportunityWorkspaces();closeModal();show('Opportunities');toast('Target account added')}catch(e){toast(e.message);button.disabled=false;button.textContent='Add to Opportunities'}}
async function removeTargetAccount(id,name){if(!confirm(`Remove ${name} from Opportunities? The account, buyer records, and research evidence will be preserved.`))return;try{await api(`/api/opportunities?id=${encodeURIComponent(id)}`,{method:'DELETE'});await loadOpportunityWorkspaces();toast('Target removed from Opportunities')}catch(e){toast(e.message)}}
async function saveOpportunityWorkspace(id,status){try{const owner=$(`owner-${id}`)?.value||'',next_action=$(`action-${id}`)?.value||'';await api('/api/opportunities',{method:'POST',body:JSON.stringify({id,status,owner,next_action})});await loadOpportunityWorkspaces();toast(status==='approved'?'Opportunity approved':'Workspace saved')}catch(e){toast(e.message)}}
const assortmentDrafts={};
function defaultProposedAssortment(w){const saved=w.scenario?.proposed_assortment;if(Array.isArray(saved))return saved.map(x=>({...x}));return (w.scenario?.account?.product_contributions||[]).map(p=>({product_id:String(p.product_id),product_name:p.product_name,brand_name:p.brand_name||'',sku:p.sku||'',role:'core',notes:'',modeled_contribution:Number(p.base_manufacturer_revenue)||0}))}
function syncAssortmentDraft(id){const rows=assortmentDrafts[id]||[];rows.forEach((item,i)=>{item.sku=$(`assortmentSku-${i}`)?.value||item.sku||'';item.role=$(`assortmentRole-${i}`)?.value||item.role||'core';item.notes=$(`assortmentNotes-${i}`)?.value||item.notes||''});return rows}
function assortmentRowsHtml(id){const rows=assortmentDrafts[id]||[];return rows.map((item,i)=>{const product=(state.portfolio.products||[]).find(p=>String(p.id)===String(item.product_id)),variants=product?.variants||[];return `<tr><td><b>${esc(item.brand_name||product?.brand_name||'')} · ${esc(item.product_name||product?.name||'Catalog product')}</b></td><td><select id="assortmentSku-${i}">${variants.length?variants.map(v=>{const sku=v.sku||v.variant_name||'';return `<option value="${esc(sku)}" ${String(sku)===String(item.sku)?'selected':''}>${esc(sku||'Unspecified SKU')}</option>`}).join(''):`<option value="${esc(item.sku||'')}">${esc(item.sku||'Unspecified SKU')}</option>`}</select></td><td><select id="assortmentRole-${i}"><option value="opening">Opening</option><option value="core">Core</option><option value="premium">Premium</option><option value="add_on">Add-on</option></select></td><td><b>${fmtMoney(item.modeled_contribution)}</b><div class="muted">Reference only</div></td><td><input id="assortmentNotes-${i}" value="${esc(item.notes||'')}" placeholder="Pitch, placement, or rationale"></td><td><button class="btn danger" onclick="removeAssortmentProduct('${esc(id)}',${i})">Remove</button></td></tr>`}).join('')||'<tr><td colspan="6"><div class="empty">No products are currently included. Add a portfolio product below.</div></td></tr>'}
function renderAssortmentRows(id){const target=$('assortmentRows');if(target){target.innerHTML=assortmentRowsHtml(id);(assortmentDrafts[id]||[]).forEach((item,i)=>{if($(`assortmentRole-${i}`))$(`assortmentRole-${i}`).value=item.role||'core'})}}
function addAssortmentProduct(id){syncAssortmentDraft(id);const productId=$('assortmentAddProduct')?.value,product=(state.portfolio.products||[]).find(p=>String(p.id)===String(productId));if(!product){toast('Choose a portfolio product');return}if((assortmentDrafts[id]||[]).some(x=>String(x.product_id)===String(productId))){toast('That product is already in the proposed assortment');return}const variant=(product.variants||[])[0]||{};assortmentDrafts[id].push({product_id:String(product.id),product_name:product.name,brand_name:product.brand_name||'',sku:variant.sku||variant.variant_name||'',role:'core',notes:'',modeled_contribution:0});renderAssortmentRows(id)}
function removeAssortmentProduct(id,index){syncAssortmentDraft(id);assortmentDrafts[id].splice(index,1);renderAssortmentRows(id)}
async function saveProposedAssortment(id){const button=$('saveAssortmentBtn'),w=state.workspaces.find(x=>String(x.id)===String(id));if(!w)return;button.disabled=true;button.textContent='Saving Assortment…';try{await api('/api/opportunities',{method:'POST',body:JSON.stringify({id,status:w.status,proposed_assortment:syncAssortmentDraft(id)})});await loadOpportunityWorkspaces();openOpportunityWorkspace(id);toast('Proposed assortment saved')}catch(e){toast(e.message);button.disabled=false;button.textContent='Save Proposed Assortment'}}
async function saveOpportunityBuyer(id){const button=$('saveOpportunityBuyerBtn'),w=state.workspaces.find(x=>String(x.id)===String(id));if(!w)return;button.disabled=true;button.textContent='Saving Buyer…';try{await api('/api/opportunities',{method:'POST',body:JSON.stringify({id,status:w.status,assigned_buyer_id:$('opportunityBuyer')?.value||''})});await loadOpportunityWorkspaces();openOpportunityWorkspace(id);toast($('opportunityBuyer')?.value?'Buyer assigned to opportunity':'Buyer assignment cleared')}catch(e){toast(e.message);button.disabled=false;button.textContent='Assign Buyer'}}
function competitiveOfferingsHtml(rows=[]){return `<div class="tableWrap"><table class="table"><thead><tr><th>Competitive Offering</th><th>Category</th><th>Price</th><th>Availability</th><th>Evidence</th><th>Source</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${esc(p.brand||'—')} · ${esc(p.name)}</b></td><td>${esc(p.category||'—')}</td><td>${esc(p.price_text||'—')}</td><td>${esc(p.availability||'Not stated')}</td><td><span class="${p.verification_status==='VERIFIED'?'evidenceVerified':'evidenceNeeded'}">${esc((p.verification_status||'REVIEW_REQUIRED').replaceAll('_',' '))}</span>${p.observed_at?`<div class="muted">Observed ${esc(new Date(p.observed_at).toLocaleDateString())}</div>`:''}</td><td>${p.source_url?`<a href="${esc(p.source_url)}" target="_blank" rel="noopener noreferrer">Open source</a>`:'—'}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">No source-backed competitive offerings are stored for this account yet.</div>'}</div>`}
function comparisonTokens(value){const stop=new Set(['and','the','for','with','from','your','product','products','series','system']);return [...new Set(String(value||'').toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>2&&!stop.has(x)))]}
function accountAssortmentComparisonHtml(w){const proposed=defaultProposedAssortment(w),competitive=w.competitive_offerings||[];return `<div class="tableWrap"><table class="table"><thead><tr><th>Your Proposed Product</th><th>Account's Competitive Offerings</th><th>Comparison Status</th></tr></thead><tbody>${proposed.map(item=>{const product=(state.portfolio.products||[]).find(p=>String(p.id)===String(item.product_id))||{},ours=comparisonTokens([item.product_name,product.name,product.category,product.product_family,...(product.categories||[])].join(' ')),matches=competitive.map(p=>{const theirs=comparisonTokens([p.name,p.brand,p.category].join(' ')),shared=ours.filter(x=>theirs.includes(x));return {p,score:shared.length,shared}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,8);return `<tr><td><b>${esc(item.brand_name||product.brand_name||'')} · ${esc(item.product_name||product.name||'Portfolio product')}</b><div class="muted">${esc(item.sku||'SKU not selected')} · ${esc((item.role||'core').replaceAll('_',' '))}</div></td><td>${matches.length?matches.map(({p})=>`<span class="comparisonOffer"><b>${esc(p.brand||'—')} · ${esc(p.name)}</b>${p.price_text?` · ${esc(p.price_text)}`:''}<br><span class="muted">${esc(p.category||'Category not stated')} · ${p.source_url?`<a href="${esc(p.source_url)}" target="_blank" rel="noopener noreferrer">source</a>`:'source unavailable'}</span></span>`).join(''):'<span class="comparisonEmpty">No sourced comparable found</span>'}</td><td><span class="${matches.some(x=>x.p.verification_status==='VERIFIED')?'evidenceVerified':'evidenceNeeded'}">${matches.length?`${matches.length} category/name match${matches.length===1?'':'es'} · review evidence`:'Research needed'}</span></td></tr>`}).join('')}</tbody></table>${proposed.length?'':'<div class="empty">Add at least one proposed product to compare this account.</div>'}</div>`}
function openOpportunityWorkspace(id){const w=state.workspaces.find(x=>String(x.id)===String(id));if(!w)return;const account=w.scenario?.account||{},buyers=w.buyers||[],competitive=w.competitive_offerings||[],assignedBuyer=w.scenario?.assigned_buyer||{};assortmentDrafts[id]=defaultProposedAssortment(w);$('modalCard').classList.add('accountResearchModal');$('modalCard').innerHTML=`<h2>${esc(w.account_name)} Account Plan</h2><p class="muted">${esc(account.fit_reason||'Target account')} · ${esc(account.evidence_status||'INSUFFICIENT')} evidence · ${fmtMoney(account.base_manufacturer_revenue)} modeled base.</p><h3>Account Assortment Comparison</h3><p class="muted">Your proposed products are matched only to source-backed offerings found for this account. A missing comparable means more research is needed; it is not proof of whitespace.</p>${accountAssortmentComparisonHtml(w)}<div class="workspaceActions" style="margin:12px 0 20px"><button class="btn dark" onclick="closeModal();openAccountResearch('${esc(w.organization_id)}')">Research Account Products & Buyers</button></div><h3>Edit Proposed Assortment</h3><div class="tableWrap"><table class="table"><thead><tr><th>Product</th><th>SKU</th><th>Role</th><th>Modeled Contribution</th><th>Sales Notes</th><th></th></tr></thead><tbody id="assortmentRows">${assortmentRowsHtml(id)}</tbody></table></div><div class="toolbar" style="margin-top:12px"><select id="assortmentAddProduct"><option value="">Add a portfolio product…</option>${(state.portfolio.products||[]).map(p=>`<option value="${esc(p.id)}">${esc(p.brand_name||'')} · ${esc(p.name)}</option>`).join('')}</select><button class="btn ghost" onclick="addAssortmentProduct('${esc(id)}')">Add Product</button><button id="saveAssortmentBtn" class="btn" onclick="saveProposedAssortment('${esc(id)}')">Save Proposed Assortment</button></div><details style="margin:18px 0"><summary><b>All Source-Backed Account Offerings (${competitive.length})</b></summary><div style="margin-top:10px">${competitiveOfferingsHtml(competitive)}</div></details><h3>Opportunity Buyer</h3><p class="muted">Choose one saved account buyer as the primary contact for this opportunity. Assignment does not change the buyer's evidence status.</p>${buyers.length?`<div class="toolbar"><select id="opportunityBuyer"><option value="">Unassigned</option>${buyers.map(b=>`<option value="${esc(b.id)}" ${String(b.id)===String(assignedBuyer.id)?'selected':''}>${esc(b.name)} · ${esc(b.title||b.category||'Buyer')}</option>`).join('')}</select><button id="saveOpportunityBuyerBtn" class="btn" onclick="saveOpportunityBuyer('${esc(id)}')">Assign Buyer</button></div>${assignedBuyer.id?`<div class="callout" style="margin-top:10px"><b>Assigned: ${esc(assignedBuyer.name)}</b><p class="muted">${esc(assignedBuyer.title||assignedBuyer.category||'Buyer')}${assignedBuyer.email?` · ${esc(assignedBuyer.email)}`:''}${assignedBuyer.phone?` · ${esc(assignedBuyer.phone)}`:''}</p></div>`:''}`:`<div class="empty">No saved buyer data exists for this account.</div><button class="btn" onclick="closeModal();openAccountResearch('${esc(w.organization_id)}')">Research All Buyers</button>`}<h3>Saved Account Buyers</h3>${buyers.length?buyerTableHtml(buyers):'<div class="empty">Run buyer research to create an account-level buyer list.</div>'}<button class="btn secondary" onclick="closeModal()">Close</button>`;$('modal').classList.add('show');renderAssortmentRows(id)}
function exportOpportunityWorkspaces(){if(!state.workspaces.length){toast('No workspaces to export');return}const rows=[['Account','Domain','Route','Status','Priority','Owner','Next Action','Modeled Base','Evidence Backed','Evidence Status','Fit Score','Fit Reason','Saved Buyers'],...state.workspaces.map(w=>{const a=w.scenario?.account||{};return [w.account_name,w.domain,w.route_to_market,w.status,w.priority,w.owner,w.next_action,a.base_manufacturer_revenue,a.evidence_backed_manufacturer_revenue,a.evidence_status,a.fit_score,a.fit_reason,w.buyer_count]})],csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n'),link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));link.download='launchpad36-opportunity-workspaces.csv';link.click();URL.revokeObjectURL(link.href)}
function evidence(){return `<div class="pageHead"><div><h1>Evidence Explorer</h1><p>Research an account across multiple relevant pages, or inspect stored attributable observations by account.</p></div><div><button class="btn secondary" onclick="openReplaceMonitor()">Replace Monitoring Target</button> <button class="btn secondary" onclick="extractStructuredProducts()">Re-extract Product Data</button> <button class="btn" onclick="loadEvidence()">Refresh Evidence</button></div></div><div class="card"><div class="toolbar"><select id="evidenceAccount" onchange="syncEvidenceAccount()">${orgOptions()}</select><input id="evidenceWebsite" placeholder="retailer.com or retailer.com/category"><input id="evidenceCategory" placeholder="Category, e.g. TV mounts"><button class="btn dark" onclick="researchEvidenceAccount()">Research Account</button></div><p class="muted">Website addresses work with or without https://. Account research searches multiple relevant product pages and account-level buyer sources.</p></div><div id="evidenceResults"><div class="card empty">Loading commercial evidence…</div></div>`}
function syncEvidenceAccount(){const org=(state.orgs||[]).find(o=>String(o.id)===String($('evidenceAccount')?.value));if(org){$('evidenceWebsite').value=org.domain||org.source_url||'';$('evidenceCategory').value=(org.categories||[])[0]||''}loadEvidence()}
function researchEvidenceAccount(){const orgId=$('evidenceAccount')?.value;if(!orgId){toast('Choose an account');return}openAccountResearch(orgId);setTimeout(()=>{if($('researchWebsite'))$('researchWebsite').value=$('evidenceWebsite')?.value||'';if($('productResearchQuery'))$('productResearchQuery').value=$('evidenceCategory')?.value||''},0)}
async function loadEvidence(){const target=$('evidenceResults');if(!target)return;target.innerHTML='<div class="card empty">Loading commercial evidence…</div>';try{const orgId=$('evidenceAccount')?.value||'',d=await api(`/api/living-intelligence-status?limit=250${orgId?`&organization_id=${encodeURIComponent(orgId)}`:''}`);state.evidence=d.operational_status||[];state.pendingReview=Number(d.pending_review)||0;target.innerHTML=`<div class="stats"><div class="card stat"><small>Latest Observations</small><strong>${state.evidence.length}</strong><span class="muted">One latest record per subject</span></div><div class="card stat"><small>Structured Products</small><strong>${state.evidence.reduce((n,x)=>n+(Number(x.offering_count)||0),0)}</strong><span class="muted">Explicitly extracted relevant products</span></div><div class="card stat"><small>Pending Review</small><strong>${state.pendingReview}</strong><span class="muted">Latest observations requiring review</span></div><div class="card stat"><small>Verified</small><strong>${state.evidence.filter(x=>x.verification_status==='VERIFIED').length}</strong><span class="muted">Deterministically verified evidence</span></div></div><div class="card tableWrap"><table class="table"><thead><tr><th>Account</th><th>Subject</th><th>Products</th><th>Evidence Type</th><th>Observed</th><th>Confidence</th><th>Status</th><th>Changed</th><th>Source</th><th>Review</th></tr></thead><tbody>${state.evidence.map(x=>`<tr><td><b>${esc(x.account_name||'—')}</b></td><td><b>${esc(x.subject_type)}</b><div class="muted">${esc(x.subject_key)}</div></td><td><b>${Number(x.offering_count)||0}</b></td><td><span class="badge">${esc(x.evidence_type)}</span></td><td>${x.observed_at?esc(new Date(x.observed_at).toLocaleString()):'—'}</td><td>${Number(x.confidence)||0}%</td><td><span class="pill">${esc(x.verification_status||'UNKNOWN')}</span></td><td>${x.changed_since_last_check?'Yes':'No'}</td><td>${x.source_url?`<a href="${esc(x.source_url)}" target="_blank" rel="noopener noreferrer">Open source</a>`:'—'}</td><td>${Number(x.offering_count)>0?`<button class="btn ghost" onclick="openEvidenceReview(${Number(x.evidence_id)})">Review Products</button>`:'Source only'}</td></tr>`).join('')}</tbody></table>${state.evidence.length?'':'<div class="empty">No commercial evidence has been stored for this selection.</div>'}</div>`}catch(e){target.innerHTML=`<div class="card"><h3 style="color:#b53b3b">Evidence could not be loaded</h3><p class="muted">${esc(e.message)}</p></div>`}}
async function extractStructuredProducts(){try{toast('Extracting category-relevant products…');const d=await api('/api/living-intelligence-refresh',{method:'POST',body:JSON.stringify({limit:25,force:true})}),count=(d.results||[]).reduce((n,x)=>n+(Number(x.offering_count)||0),0),discarded=(d.results||[]).reduce((n,x)=>n+(Number(x.discarded_irrelevant_count)||0),0),failed=(d.results||[]).filter(x=>x.status!=='SUCCESS');if(failed.length)throw new Error(failed[0].error||'Structured extraction failed');toast(`Kept ${count}; rejected ${discarded} irrelevant products`);await loadEvidence()}catch(e){toast(e.message)}}
async function openReplaceMonitor(){$('modalCard').innerHTML='<div class="empty">Loading active monitoring targets…</div>';$('modal').classList.add('show');try{const d=await api('/api/monitor-targets'),targets=(d.monitor_targets||[]).filter(x=>x.state==='active');$('modalCard').innerHTML=`<h2>Replace Monitoring Target</h2><p class="muted">Only the selected target will be deactivated. Use a real retailer search or category-results URL and a narrow category focus. https:// is optional.</p><div class="formGrid"><div class="field full"><label>Target to replace</label><select id="replaceTarget">${targets.map(x=>`<option value="${esc(x.id)}">${esc(x.source_url)}</option>`).join('')}</select></div><div class="field full"><label>New retailer category/search URL</label><input id="replaceUrl" placeholder="homedepot.com/s/tv%20mounts"></div><div class="field"><label>Category focus</label><input id="replaceFocus" value="TV mounts"></div><div class="field"><label>Refresh cadence</label><select id="replaceTier"><option value="weekly">Weekly</option><option value="daily">Daily</option><option value="monthly">Monthly</option></select></div></div><div id="replaceResult" style="margin-top:12px"></div><div style="margin-top:15px"><button class="btn" ${targets.length?'':'disabled'} onclick="saveReplacementMonitor()">Replace & Test Target</button> <button class="btn secondary" onclick="closeModal()">Cancel</button></div>`}catch(e){$('modalCard').innerHTML=`<h3>Targets could not be loaded</h3><p class="muted">${esc(e.message)}</p>`}}
async function saveReplacementMonitor(){const url=$('replaceUrl').value.trim(),focus=$('replaceFocus').value.trim(),targetId=$('replaceTarget').value,result=$('replaceResult');if(!url||!focus||!targetId){toast('Select a target and enter a URL and category');return}result.innerHTML='<div class="empty">Replacing target and testing category relevance…</div>';try{await api('/api/monitor-targets',{method:'POST',body:JSON.stringify({source_url:url,category_focus:focus,target_type:'retailer_assortment',refresh_tier:$('replaceTier').value,replace_target_id:targetId})});const d=await api('/api/living-intelligence-refresh',{method:'POST',body:JSON.stringify({limit:1,force:true})}),first=d.results?.[0];if(!first||first.status!=='SUCCESS')throw new Error(first?.error||'Replacement target test failed');result.innerHTML=`<div class="callout"><b>${Number(first.offering_count)||0} relevant products retained</b><p class="muted">Category: ${esc(first.category_focus||focus)} · ${Number(first.discarded_irrelevant_count)||0} unrelated products rejected. Resolved URL: ${esc(first.resolved_url||url)}</p></div>`;setTimeout(async()=>{closeModal();await loadEvidence()},1800)}catch(e){result.innerHTML=`<div class="callout"><b style="color:#b53b3b">Target test failed</b><p class="muted">${esc(e.message)}</p></div>`}}
async function openEvidenceReview(id){$('modalCard').innerHTML='<div class="empty">Loading structured evidence…</div>';$('modal').classList.add('show');try{const d=await api(`/api/evidence-review?id=${id}`),e=d.evidence,rows=e.offerings||[];$('modalCard').innerHTML=`<h2>Review Structured Products</h2><p class="muted">Source: <a href="${esc(e.source_url)}" target="_blank" rel="noopener noreferrer">${esc(e.source_url)}</a><br>Observed ${esc(new Date(e.observed_at).toLocaleString())} · Confidence ${Number(e.confidence)||0}% · ${esc(e.verification_status)}</p><div class="tableWrap"><table class="table"><thead><tr><th>Brand</th><th>Product</th><th>Price</th><th>Availability</th><th>Evidence quote</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.brand||'—')}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.price_text||'—')}</td><td>${esc(x.availability||'—')}</td><td class="muted">${esc(x.evidence_quote||'No exact quote extracted')}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">No structured products are available for review.</div>'}</div><div style="margin-top:15px">${e.verification_status==='VERIFIED'?'<span class="pill">Verified commercial truth</span>':e.verification_status==='REJECTED'?'<span class="badge">Rejected evidence</span>':`<button class="btn dark" ${rows.length?'':'disabled'} onclick="approveEvidence(${id})">Approve as Verified</button> <button class="btn secondary" onclick="rejectEvidence(${id})">Reject Evidence</button>`} <button class="btn secondary" onclick="closeModal()">Close</button></div>`}catch(e){$('modalCard').innerHTML=`<h3>Evidence could not be loaded</h3><p class="muted">${esc(e.message)}</p><button class="btn secondary" onclick="closeModal()">Close</button>`}}
async function approveEvidence(id){if(!confirm('Approve these structured products as verified commercial evidence?'))return;try{const d=await api('/api/evidence-review',{method:'POST',body:JSON.stringify({evidence_id:id,action:'approve'})});if(!d.approved)throw new Error('Evidence approval did not complete');closeModal();toast('Evidence approved as verified');await loadEvidence()}catch(e){toast(e.message)}}
async function rejectEvidence(id){const reason=prompt('Reason for rejection','Products are unrelated to the target category');if(reason===null)return;try{const d=await api('/api/evidence-review',{method:'POST',body:JSON.stringify({evidence_id:id,action:'reject',reason})});if(!d.rejected)throw new Error('Evidence rejection did not complete');closeModal();toast('Irrelevant evidence rejected');await loadEvidence()}catch(e){toast(e.message)}}
function systemStatus(){return `<div class="pageHead"><div><h1>System Status</h1><p>Production readiness by component. Configured does not mean proven; each workflow must produce stored evidence and a visible change event.</p></div><button class="btn" onclick="loadSystemStatus()">Run Health Check</button></div><div id="systemStatus"><div class="card empty">Running production health checks…</div></div>`}
function statusColor(status){return ['WORKING','READY','OPERATIONAL'].includes(status)?'#18795a':['FAILED','NOT_CONFIGURED','NOT_READY'].includes(status)?'#b53b3b':'#9a6a12'}
async function loadSystemStatus(){const target=$('systemStatus');if(!target)return;target.innerHTML='<div class="card empty">Running production health checks…</div>';try{const d=await api('/api/system-status'),schema=(d.components||[]).find(x=>x.name==='Schema'),monitoring=(d.components||[]).find(x=>x.name==='Monitoring'),repair=schema?.missing?.length?`<div class="callout" style="margin-top:14px"><b>Database migration required</b><p class="muted">${schema.missing.length} V9.8.3 table(s) are missing. Initialization is repeatable and preserves existing records.</p><button class="btn dark" onclick="initializeSchema()">Initialize Missing Schema</button></div>`:'',monitorAction=!schema?.missing?.length&&monitoring?.status==='NOT_CONFIGURED'?`<div class="callout" style="margin-top:14px"><b>Start the first evidence workflow</b><p class="muted">Add one public retailer or category URL. Launchpad36 will save the target, run a live Firecrawl scrape, store attributable evidence, and create the first change event.</p><button class="btn dark" onclick="openMonitorSetup()">Add First Monitoring Target</button></div>`:'';target.innerHTML=`<div class="callout"><b>Overall: <span style="color:${statusColor(d.overall_status)}">${esc(d.overall_status)}</span></b><p class="muted">Version ${esc(d.version)} · Commit ${esc(String(d.commit).slice(0,12))} · Checked ${esc(new Date(d.checked_at).toLocaleString())}</p></div>${repair}${monitorAction}<div class="grid3" style="margin-top:14px">${(d.components||[]).map(x=>`<div class="card"><div class="label">${esc(x.name)}</div><h3 style="color:${statusColor(x.status)}">${esc(x.status)}</h3><p class="muted">${esc(x.detail)}</p>${x.missing?.length?`<p class="muted"><b>Missing:</b> ${esc(x.missing.join(', '))}</p>`:''}${x.last_check?`<p class="muted">Last check: ${esc(new Date(x.last_check).toLocaleString())}</p>`:''}</div>`).join('')}</div>`}catch(e){target.innerHTML=`<div class="card"><h3 style="color:#b53b3b">Health check failed</h3><p class="muted">${esc(e.message)}</p></div>`}}
async function initializeSchema(){if(!confirm('Initialize the missing V9.8.3 database schema? Existing records will be preserved.'))return;try{toast('Initializing database schema…');const d=await api('/api/db-init-v9-8',{method:'POST',body:'{}'});if(!d.initialized)throw new Error('Initialization did not complete');toast('Schema initialized');await loadSystemStatus()}catch(e){toast(e.message)}}
function openMonitorSetup(){$('modalCard').innerHTML=`<h2>Add First Monitoring Target</h2><p class="muted">Use a public retailer category or product-listing URL. Category is stored separately and enforced on every refresh. https:// is optional.</p><div class="formGrid"><div class="field full"><label>Public retailer or category URL</label><input id="monitorUrl" placeholder="retailer.com/category/tv-mounts"></div><div class="field"><label>Category</label><input id="monitorCategory" placeholder="TV mounts"></div><div class="field"><label>Evidence type</label><select id="monitorType"><option value="retailer_assortment">Retailer assortment</option><option value="retailer_company">Retailer company</option><option value="buyer_leadership">Buyer / leadership</option></select></div><div class="field"><label>Refresh cadence</label><select id="monitorTier"><option value="weekly">Weekly</option><option value="daily">Daily</option><option value="monthly">Monthly</option></select></div></div><div id="monitorResult" style="margin-top:12px"></div><div style="margin-top:15px"><button class="btn" onclick="saveAndRunMonitor()">Save & Run Live Scrape</button> <button class="btn secondary" onclick="closeModal()">Cancel</button></div>`;$('modal').classList.add('show')}
async function saveAndRunMonitor(){const url=$('monitorUrl').value.trim(),category=$('monitorCategory').value.trim(),result=$('monitorResult');if(!url||!category){toast('Enter a public URL and category');return}result.innerHTML='<div class="empty">Saving target and running the first live scrape…</div>';try{await api('/api/monitor-targets',{method:'POST',body:JSON.stringify({source_url:url,category_focus:category,target_type:$('monitorType').value,refresh_tier:$('monitorTier').value})});const run=await api('/api/living-intelligence-refresh',{method:'POST',body:JSON.stringify({limit:1})}),first=run.results?.[0];if(!first||first.status!=='SUCCESS')throw new Error(first?.error||'The live scrape did not complete');result.innerHTML=`<div class="callout"><b>First evidence workflow completed</b><p class="muted">Category: ${esc(category)} · Evidence status: ${esc(first.verification_status)} · Change detected: ${first.changed_since_last_check?'Yes':'No'}</p></div>`;toast('Live evidence stored');setTimeout(async()=>{closeModal();await loadSystemStatus()},1200)}catch(e){result.innerHTML=`<div class="callout"><b style="color:#b53b3b">Live scrape failed</b><p class="muted">${esc(e.message)}</p></div>`}}
function openAdmin(){if(state.auth){logout();return}$('modalCard').innerHTML=`<h2>Admin Unlock</h2><p class="muted">Controlled-build authentication. Production customer identity/RBAC comes before paid beta.</p><div class="field"><label>Admin secret</label><input id="secret" type="password"></div><div style="margin-top:15px"><button class="btn" onclick="unlock()">Unlock</button> <button class="btn secondary" onclick="closeModal()">Cancel</button></div>`;$('modal').classList.add('show')}
async function unlock(){try{await api('/api/session',{method:'POST',body:JSON.stringify({secret:$('secret').value})});state.auth=true;await load();closeModal();renderAuth();show('Dashboard');toast('Platform unlocked')}catch(e){toast(e.message)}}
async function logout(){try{await api('/api/session',{method:'DELETE'})}catch{}state.auth=false;state.portfolio={brands:[],products:[]};state.orgs=[];state.opps=[];renderAuth();show('Dashboard')}
function closeModal(){$('modal').classList.remove('show');$('modalCard').classList.remove('accountResearchModal')}
function openBrand(){$('modalCard').innerHTML=`<h2>Add Brand</h2><div class="formGrid"><div class="field"><label>Brand Name</label><input id="brName"></div><div class="field"><label>Website</label><input id="brWeb" placeholder="https://"></div><div class="field full"><label>Description</label><textarea id="brDesc"></textarea></div></div><div style="margin-top:14px"><button class="btn" onclick="saveBrand()">Save Brand</button> <button class="btn secondary" onclick="closeModal()">Cancel</button></div>`;$('modal').classList.add('show')}
async function saveBrand(){try{await api('/api/brands',{method:'POST',body:JSON.stringify({name:$('brName').value,website:$('brWeb').value,description:$('brDesc').value})});await load();closeModal();render();toast('Brand saved')}catch(e){toast(e.message)}}
function openImport(){$('modalCard').innerHTML=`<h2>Import Product Catalog</h2><div class="seg"><button class="active" onclick="showImportTab('excel',this)">Excel / CSV</button><button onclick="showImportTab('web',this)">Vendor Website</button></div><div id="importBody" style="margin-top:14px">${excelImportHtml()}</div>`;$('modal').classList.add('show')}
function showImportTab(t,b){document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('importBody').innerHTML=t==='excel'?excelImportHtml():webImportHtml()}
function excelImportHtml(){return `<div class="uploadBox"><b>Upload .xlsx, .xls or .csv</b><p class="muted">Required columns: Brand, Product Name, SKU. Recommended: Product Family, Category, MSRP, MAP, Wholesale, UPC, Model Number, Features, Channels, Product URL, Image URL.</p><input type="file" id="catalogFile" accept=".xlsx,.xls,.csv"><div style="margin-top:12px"><button class="btn" onclick="parseCatalog()">Preview Import</button> <button class="btn secondary" onclick="loadDemoCatalog()">Load Demo Catalog — Aurelius Audio</button></div><p class="muted">Demo products are fictional and clearly marked <code>demo_data</code>. Nothing is saved until you approve the review.</p></div><div id="importPreview"></div>`}
function webImportHtml(){return `<div class="field"><label>Vendor / Brand Website (https:// optional)</label><input id="vendorUrl" placeholder="manufacturer.com"></div><div style="margin-top:12px"><button class="btn" onclick="discoverWebsite()">Discover Product Pages</button></div><div id="webPreview"></div>`}
let pendingRows=[],pendingReview=null,pendingSource={type:'excel',name:''};async function reviewCatalog(rows,type,name){pendingReview=null;pendingRows=[];$('importPreview').innerHTML='<div class="empty">Validating catalog for review…</div>';const d=await api('/api/catalog-import',{method:'POST',body:JSON.stringify({mode:'review',source_type:type,source_name:name,rows})});pendingRows=d.rows||[];pendingReview=d;pendingSource={type,name};$('importPreview').innerHTML=`<div class="callout" style="margin-top:14px"><b>${d.rows_valid} valid of ${d.rows_seen} rows · ${esc(d.status)}</b><p class="muted">Review the normalized records below. No products have been saved.</p>${d.errors?.length?`<div class="risk">${esc(JSON.stringify(d.errors.slice(0,10)))}</div>`:''}<pre style="white-space:pre-wrap;font-size:10px;max-height:360px;overflow:auto">${esc(JSON.stringify(pendingRows,null,2))}</pre><button class="btn dark" ${pendingRows.length?'':'disabled'} onclick="commitCatalog()">Approve & Import ${pendingRows.length} Rows</button></div>`}
async function parseCatalog(){const f=$('catalogFile').files[0];if(!f){toast('Choose a file');return}try{const buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:''});await reviewCatalog(rows,f.name.toLowerCase().endsWith('.csv')?'csv':'excel',f.name)}catch(e){toast(e.message)}}
async function loadDemoCatalog(){try{$('importPreview').innerHTML='<div class="empty">Loading fictional Aurelius Audio demo…</div>';const d=await api('/api/demo-catalog');await reviewCatalog(d.rows,'demo','Aurelius Audio fictional demo catalog')}catch(e){toast(e.message)}}
async function commitCatalog(){if(!pendingReview?.review_token){toast('Review the catalog first');return}try{const d=await api('/api/catalog-import',{method:'POST',body:JSON.stringify({approved:true,review_token:pendingReview.review_token,source_type:pendingSource.type,source_name:pendingSource.name,rows:pendingRows})});await load();closeModal();render();toast(`Imported ${d.rows_imported} approved ${d.source_type} rows`)}catch(e){toast(e.message)}}
async function discoverWebsite(){try{$('webPreview').innerHTML='<div class="empty">Discovering public product pages…</div>';const d=await api('/api/catalog-website',{method:'POST',body:JSON.stringify({website:$('vendorUrl').value,limit:40})});$('webPreview').innerHTML=`<div class="callout" style="margin-top:14px"><b>${esc(d.status)} · ${(d.candidates||[]).length} candidates</b><p class="muted">${esc(d.interpretation||'Review required before catalog ingestion.')}</p>${(d.candidates||[]).slice(0,20).map(x=>`<div class="item"><b>${esc(x.title||x.url)}</b><p>${esc(x.url)}</p></div>`).join('')}</div>`}catch(e){toast(e.message)}}
boot();
</script></body></html>
