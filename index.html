<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launchpad36 AI | Retail Revenue Intelligence</title>
<style>
:root{--navy:#071a39;--navy2:#0d2e5d;--blue:#2f6fed;--blue2:#75a7ff;--ink:#14283f;--muted:#71869e;--line:#dde7f1;--bg:#f4f8fc;--card:#fff;--good:#198754;--warn:#a86a0a;--bad:#ad3840}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:linear-gradient(180deg,#071a39,#092550);color:#dce8f7;padding:20px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:2px 7px 19px;border-bottom:1px solid rgba(255,255,255,.09)}.brand img{width:64px;height:44px;object-fit:contain;background:white;border-radius:10px;padding:4px}.brand b{font-size:12px;letter-spacing:.08em}.brand small{display:block;font-size:8px;letter-spacing:.13em;color:#8eabd0;margin-top:2px}.nav{display:flex;flex-direction:column;gap:6px;margin-top:18px}.nav button{border:0;background:transparent;color:#92aac4;text-align:left;padding:11px 12px;border-radius:11px;font-weight:750;cursor:pointer}.nav button:hover,.nav button.active{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 2px 0 #5a94ff}.sideFoot{margin-top:auto;border-top:1px solid rgba(255,255,255,.09);padding:14px 8px;font-size:9px;color:#829bb8}.main{min-width:0}.top{height:66px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.online{font-size:10px;font-weight:850;letter-spacing:.08em;color:#647991}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#23a36e;margin-right:7px}.topActions{display:flex;gap:8px;align-items:center}.content{max-width:1480px;margin:auto;padding:26px}.screen{display:none}.screen.active{display:block}.hero{background:linear-gradient(125deg,#08224b,#0e3b74);border-radius:24px;color:white;padding:30px;display:flex;justify-content:space-between;gap:24px;align-items:center;box-shadow:0 22px 55px rgba(10,43,89,.17)}.eyebrow{font-size:9px;letter-spacing:.17em;color:#85b5ff;font-weight:900}.hero h1,.pageHead h1{font-size:34px;letter-spacing:-.04em;margin:7px 0 9px}.hero p{max-width:760px;color:#b3c9e4;line-height:1.6;font-size:13px}.btn{border:0;background:var(--blue);color:white;border-radius:11px;padding:10px 14px;font-weight:850;cursor:pointer}.btn.secondary{background:#fff;color:#1d569e;border:1px solid #cddbef}.btn.ghost{background:#edf4ff;color:#235ca8}.btn.dark{background:#0a2b59}.btn.small{padding:7px 10px;font-size:10px}.btn:disabled{opacity:.55;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:16px 0}.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 11px 30px rgba(22,52,88,.05)}.stat small,.label{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:#7b8ea5;font-weight:850}.stat strong{display:block;font-size:25px;margin:4px 0}.muted{color:var(--muted);font-size:10px;line-height:1.5}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pageHead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:15px}.pageHead p{color:#7489a1;font-size:12px;max-width:760px;line-height:1.55}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{border:1px solid #d6e1ed;border-radius:10px;padding:10px 11px;background:#fff;color:#18324e}.toolbar input{min-width:250px}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:11px}.table th{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:8px;text-transform:uppercase;letter-spacing:.09em;color:#6e8299}.table td{padding:12px 10px;border-bottom:1px solid #edf2f7;vertical-align:middle}.clickable{cursor:pointer}.clickable:hover{background:#f6f9fd}.score{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ebf3ff;color:#1e5cb1;font-weight:900}.pill,.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:8px;font-weight:850}.pill{background:#eaf7f0;color:#247a57}.badge{background:#eef4fd;color:#2b64ad}.status{font-size:8px;font-weight:900;border-radius:999px;padding:5px 8px;background:#edf1f5;color:#617389}.status.ok{background:#e9f7ef;color:#227c57}.status.warn{background:#fff5df;color:#92651b}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:flex;flex-direction:column;gap:6px;font-size:9px;font-weight:800;color:#60758d}.form textarea{min-height:82px}.full{grid-column:1/-1}.modal{display:none;position:fixed;inset:0;background:rgba(5,19,40,.58);align-items:center;justify-content:center;padding:20px;z-index:30}.modal.show{display:flex}.modalCard{background:#fff;border-radius:20px;padding:21px;width:min(780px,96vw);max-height:92vh;overflow:auto}.modalTop{display:flex;align-items:center;justify-content:space-between;gap:15px}.x{border:0;background:#eff3f7;color:#6e8196;border-radius:8px;padding:7px 10px;cursor:pointer}.empty{padding:25px;text-align:center;color:#8193a8}.accountHero{background:linear-gradient(135deg,#fff,#f0f6ff);border:1px solid #dce8f5;border-radius:20px;padding:20px;display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.accountHero h2{font-size:26px;margin:4px 0}.intelFlow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.flowStep{background:white;border:1px solid var(--line);border-radius:14px;padding:13px;min-height:95px}.flowStep b{display:block;font-size:12px;margin:6px 0}.flowStep .num{width:26px;height:26px;border-radius:8px;background:#eaf2ff;color:#2364b6;display:grid;place-items:center;font-size:10px;font-weight:900}.intelGrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}.sectionTitle h3{margin:0;font-size:15px}.item{border:1px solid #e1e8f1;border-radius:12px;padding:12px;margin-bottom:8px}.item b{font-size:11px}.item p{font-size:10px;color:#667d96;line-height:1.5;margin:5px 0}.metricGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#f7f9fc;border:1px solid #e1e8f0;border-radius:12px;padding:11px}.metric b{display:block;font-size:19px}.strategy{background:linear-gradient(135deg,#f8fbff,#fff);border:1px solid #dfe9f5;border-radius:14px;padding:14px}.strategy h4{margin:0 0 7px}.strategy ul{margin:0;padding-left:18px;font-size:10px;color:#617891;line-height:1.7}.leadSku{background:#edf5ff;border:1px solid #cedff5;border-radius:14px;padding:14px}.variantRow{display:grid;grid-template-columns:1.2fr .8fr .8fr .8fr 34px;gap:8px;align-items:end;margin-top:8px}.variantRow input{width:100%}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#0a2c59;color:#fff;border-radius:11px;padding:11px 14px;font-size:10px;z-index:50}.toast.show{display:block}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #c9d8ea;border-top-color:#2f6fed;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1100px){.stats,.intelFlow{grid-template-columns:1fr 1fr}.grid2,.grid3,.intelGrid{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{height:auto;position:relative}.nav{flex-direction:row;overflow:auto}.sideFoot{display:none}.top{padding:0 14px}.content{padding:17px 13px}.hero,.accountHero{flex-direction:column}.stats,.intelFlow,.metricGrid{grid-template-columns:1fr 1fr}.formGrid{grid-template-columns:1fr}.full{grid-column:auto}.variantRow{grid-template-columns:1fr 1fr}.variantRow button{grid-column:2}.variantRow .hideMobile{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand"><img src="/logo.jpeg"><div><b>LAUNCHPAD36 AI</b><small>RETAIL REVENUE INTELLIGENCE</small></div></div><div id="nav" class="nav"></div><div class="sideFoot">PLATFORM BUILD v9<br>Database-first • Neon • Revenue Intelligence</div></aside>
<main class="main"><div class="top"><div class="online"><span class="dot"></span><span id="systemText">CONNECTING TO INTELLIGENCE DATABASE</span></div><div class="topActions"><span id="authBadge" class="status">READ ONLY</span><button class="btn small secondary" onclick="openAdmin()">Admin Unlock</button></div></div><div class="content">
<section class="screen active" id="Dashboard"></section><section class="screen" id="Accounts"></section><section class="screen" id="Products"></section><section class="screen" id="Buyers"></section><section class="screen" id="Opportunities"></section><section class="screen" id="AccountDetail"></section>
</div></main></div>
<div class="modal" id="modal"><div class="modalCard" id="modalBody"></div></div><div class="toast" id="toast"></div>
<script>
const NAV=['Dashboard','Accounts','Products','Buyers','Opportunities'];
const state={accounts:[],products:[],buyers:[],opportunities:[],currentAccount:null,auth:false,intel:{}};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function money(v){return Number(v||0).toLocaleString(undefined,{style:'currency',currency:'USD',maximumFractionDigits:0})}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||`Request failed (${r.status})`);return j}
function nav(){ $('nav').innerHTML=NAV.map(n=>`<button data-screen="${n}" onclick="show('${n}')">${n}</button>`).join(''); }
function show(name){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(name).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===name));if(name==='Dashboard')renderDashboard();if(name==='Accounts')renderAccounts();if(name==='Products')renderProducts();if(name==='Buyers')renderBuyers();if(name==='Opportunities')renderOpportunities();}
async function boot(){nav();await Promise.allSettled([checkDb(),checkAuth(),loadCore()]);show('Dashboard')}
async function checkDb(){try{const x=await api('/api/db-status');$('systemText').textContent=x.connected?`INTELLIGENCE DATABASE ONLINE · ${x.core_tables} CORE TABLES`:'DATABASE OFFLINE'}catch{$('systemText').textContent='DATABASE STATUS UNAVAILABLE'}}
async function checkAuth(){try{const x=await api('/api/session');state.auth=!!x.authenticated}catch{state.auth=false}renderAuth()}
function renderAuth(){$('authBadge').textContent=state.auth?'ADMIN UNLOCKED':'READ ONLY';$('authBadge').className='status '+(state.auth?'ok':'')}
async function loadCore(){const [a,p,b,o]=await Promise.all([api('/api/accounts'),api('/api/products'),api('/api/buyers'),api('/api/opportunities').catch(()=>({opportunities:[]}))]);state.accounts=a.accounts||[];state.products=p.products||[];state.buyers=b.buyers||[];state.opportunities=o.opportunities||[]}
function renderDashboard(){const high=state.accounts.filter(a=>Number(a.score)>=80).length;const sku=state.products.reduce((n,p)=>n+(p.variants||[]).length,0);$('Dashboard').innerHTML=`<div class="hero"><div><div class="eyebrow">V9 · DATABASE-FIRST REVENUE INTELLIGENCE</div><h1>Find the next retail revenue opportunity.</h1><p>Launchpad36 connects your portfolio, target accounts, public buyer intelligence and retailer assortment signals into one account-level selling workflow.</p></div><button class="btn secondary" onclick="show('Accounts')">Open Account Intelligence</button></div><div class="stats"><div class="card stat"><small>Active Accounts</small><strong>${state.accounts.length}</strong><span>Stored in Neon</span></div><div class="card stat"><small>Products</small><strong>${state.products.length}</strong><span>${sku} SKU variants</span></div><div class="card stat"><small>Buyer Records</small><strong>${state.buyers.length}</strong><span>Public-source intelligence</span></div><div class="card stat"><small>High-Score Targets</small><strong>${high}</strong><span>Score 80+</span></div></div><div class="grid2"><div class="card"><div class="sectionTitle"><h3>Revenue Intelligence Workflow</h3></div><div class="intelFlow">${['Where should I sell?','Who should I contact?','What do they sell?','Where is the gap?','Which SKU should I pitch?','How should I sell it?','What changed?','Move to pipeline'].map((x,i)=>`<div class="flowStep"><div class="num">${i+1}</div><b>${x}</b><div class="muted">${['Prioritize target accounts','Surface relevant merchants','Detect retailer assortment','Model white space','Recommend lead SKU','Online + in-store strategy','Track weekly signals','Save the opportunity'][i]}</div></div>`).join('')}</div></div><div class="card"><div class="sectionTitle"><h3>Database Status</h3><span class="status ok">LIVE</span></div><p class="muted">Accounts, products/SKUs and buyers are loaded from Neon. Browser localStorage is no longer the system of record for V9 core data.</p><button class="btn ghost" onclick="checkDb()">Recheck Database</button></div></div>`}
function renderAccounts(){const rows=state.accounts.map(a=>`<tr class="clickable" onclick="openAccount('${a.id}')"><td><b>${esc(a.name)}</b><div class="muted">${esc(a.domain||'No domain')}</div></td><td>${esc(a.type)}</td><td>${esc(a.coverage||a.region||'')}</td><td>${esc(a.category)}</td><td>${money(a.potential)}</td><td><div class="score">${Number(a.score)||0}</div></td></tr>`).join('');$('Accounts').innerHTML=`<div class="pageHead"><div><div class="eyebrow">TARGET ACCOUNT DATABASE</div><h1>Accounts</h1><p>Retailers, distributors, buying groups, e-commerce accounts and specialty networks. Click an account to open its full revenue intelligence workflow.</p></div><button class="btn" onclick="openAccountForm()">+ Add Account</button></div><div class="card"><div class="toolbar"><input id="accountSearch" placeholder="Search accounts" oninput="filterAccounts(this.value)"><span class="badge">${state.accounts.length} ACTIVE</span></div><div class="tableWrap"><table class="table"><thead><tr><th>Account</th><th>Channel</th><th>Reach</th><th>Category</th><th>Potential</th><th>L36 Score</th></tr></thead><tbody id="accountRows">${rows||`<tr><td colspan="6" class="empty">No accounts yet.</td></tr>`}</tbody></table></div></div>`}
function filterAccounts(q){q=String(q).toLowerCase();document.querySelectorAll('#accountRows tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none')}
function renderProducts(){const cards=state.products.map(p=>`<div class="card"><div class="label">${esc(p.category)}</div><h3>${esc(p.name)}</h3><p class="muted">${esc(p.positioning||'')}</p><div>${(p.variants||[]).map(v=>`<div class="item"><b>${esc(v.sku||v.variant_name||'Variant')}</b><p>${esc(v.variant_name||'')} · MSRP ${money(v.msrp)} · MAP ${money(v.map)} · Wholesale ${money(v.wholesale)}</p></div>`).join('')||'<div class="muted">No variants.</div>'}</div></div>`).join('');$('Products').innerHTML=`<div class="pageHead"><div><div class="eyebrow">MANUFACTURER PORTFOLIO</div><h1>Products & SKUs</h1><p>The portfolio used by the assortment-gap engine to compare your price points and positioning against retailer assortment.</p></div><button class="btn" onclick="openProductForm()">+ Add Product</button></div><div class="grid3">${cards||'<div class="card empty">No products yet.</div>'}</div>`}
function renderBuyers(){const byId=Object.fromEntries(state.accounts.map(a=>[a.id,a.name]));const rows=state.buyers.map(b=>`<tr><td><b>${esc(b.name)}</b><div class="muted">${esc(b.title)}</div></td><td>${esc(byId[b.account_id]||'')}</td><td>${esc(b.category||'')}</td><td>${esc(b.source||'')}</td><td>${Number(b.confidence)||0}%</td><td>${esc(b.status||'')}</td></tr>`).join('');$('Buyers').innerHTML=`<div class="pageHead"><div><div class="eyebrow">PUBLIC BUYER INTELLIGENCE</div><h1>Buyers</h1><p>Business contacts with source, confidence and freshness. Launchpad36 does not infer private contact details.</p></div><button class="btn" onclick="openBuyerForm()">+ Add Buyer</button></div><div class="card"><div class="tableWrap"><table class="table"><thead><tr><th>Decision Maker</th><th>Account</th><th>Category</th><th>Source</th><th>Confidence</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">No buyer records yet.</td></tr>'}</tbody></table></div></div>`}
function renderOpportunities(){const rows=state.opportunities.map(o=>{const ex=o.explanation||{};return `<tr class="clickable" onclick="openAccount('${o.account_id}')"><td><b>${esc(o.account_name)}</b></td><td>${esc(o.product_name||ex.recommended_sku||'')}</td><td><div class="score">${Number(o.overall_score)||0}</div></td><td>${esc(ex.stage||'Target')}</td><td>${new Date(o.scored_at).toLocaleDateString()}</td></tr>`}).join('');$('Opportunities').innerHTML=`<div class="pageHead"><div><div class="eyebrow">REVENUE PIPELINE</div><h1>Opportunities</h1><p>Saved account-level intelligence scores and recommended SKUs from the L36 workflow.</p></div></div><div class="card"><div class="tableWrap"><table class="table"><thead><tr><th>Account</th><th>Recommended SKU</th><th>Score</th><th>Stage</th><th>Scored</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">No saved opportunities yet.</td></tr>'}</tbody></table></div></div>`}
async function openAccount(id){state.currentAccount=state.accounts.find(a=>a.id===id);if(!state.currentAccount)return;state.intel={};show('AccountDetail');renderAccountDetail();try{const b=await api('/api/buyers?account_id='+encodeURIComponent(id));state.intel.buyers=b.buyers||[];renderAccountDetail()}catch{}}
function showDetail(){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('AccountDetail').classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'))}
function renderAccountDetail(){showDetail();const a=state.currentAccount,i=state.intel,buyers=i.buyers||[];const current=i.current||[],comps=i.competitors||[],people=i.people||[],gap=i.gap;const lead=gap?.recommended_lead_sku;const metrics=gap?.metrics||{};$('AccountDetail').innerHTML=`<button class="btn ghost small" onclick="show('Accounts')">← Back to Accounts</button><div class="accountHero"><div><div class="eyebrow">ACCOUNT REVENUE INTELLIGENCE</div><h2>${esc(a.name)}</h2><div><span class="badge">${esc(a.type)}</span> <span class="badge">${esc(a.coverage||a.region||'')}</span> <span class="badge">${esc(a.category||'')}</span></div><p class="muted">${esc(a.domain||'Domain required for live retailer intelligence.')}</p></div><div style="text-align:right"><div class="label">L36 ACCOUNT SCORE</div><div style="font-size:42px;font-weight:950;color:#195cb2">${Number(a.score)||0}</div><button class="btn" id="runIntel" onclick="runIntel()">Run Account Intelligence</button></div></div><div class="intelFlow">${['Detected Products','Competitors','Assortment Gaps','Decision Makers','Online Strategy','In-Store Strategy','Recommended SKU','Pipeline'].map((x,n)=>`<div class="flowStep"><div class="num">${n+1}</div><b>${x}</b><div class="muted">${['Retailer-site signals','Relevant competing brands','Price + feature white space','Public professional sources','E-commerce execution','Physical retail execution','Lead product/variant','Save account opportunity'][n]}</div></div>`).join('')}</div>${i.loading?'<div class="card"><span class="spinner"></span> <span class="muted">Scanning public retailer sources and modeling the opportunity…</span></div>':''}<div class="intelGrid"><div class="card"><div class="sectionTitle"><h3>Detected on Retailer Site</h3><span class="badge">${current.length}</span></div>${current.slice(0,8).map(x=>`<div class="item"><b>${esc(x.brand)} ${esc(x.price||'')}</b><p>${esc(x.product||'').slice(0,180)}</p><div class="muted">${esc(x.availability||'')} · ${esc(x.verified_at||'')}</div></div>`).join('')||'<div class="empty">Run intelligence to scan the account website.</div>'}</div><div class="card"><div class="sectionTitle"><h3>Competitor Signals</h3><span class="badge">${comps.length}</span></div>${comps.slice(0,8).map(x=>`<div class="item"><b>${esc(x.brand)} ${esc(x.price||'')}</b><p>${esc(x.product||'').slice(0,180)}</p><div class="muted">Relevance ${Number(x.relevance)||0}% · ${esc(x.verified_at||'')}</div></div>`).join('')||'<div class="empty">No competitor scan yet.</div>'}</div><div class="card"><div class="sectionTitle"><h3>Assortment Gap</h3>${gap?`<span class="score">${gap.overall_gap_score}</span>`:''}</div>${gap?`<div class="metricGrid"><div class="metric"><small class="label">Price Gap</small><b>${metrics.price_gap||0}</b></div><div class="metric"><small class="label">Feature Gap</small><b>${metrics.feature_gap||0}</b></div><div class="metric"><small class="label">Low Density</small><b>${metrics.competitive_density||0}</b></div><div class="metric"><small class="label">Overall</small><b>${gap.overall_gap_score||0}</b></div></div>${(gap.white_spaces||[]).map(w=>`<div class="item"><b>${esc(w.title)}</b><p>${esc(w.detail)}</p></div>`).join('')}`:'<div class="empty">Gap modeling requires your product/SKU portfolio and a valid account domain.</div>'}</div><div class="card"><div class="sectionTitle"><h3>Decision Makers</h3><span class="badge">${buyers.length+people.length}</span></div>${[...buyers,...people].slice(0,8).map(x=>`<div class="item"><b>${esc(x.name)}</b><p>${esc(x.title)} · ${esc(x.category||'')}</p><div class="muted">${esc(x.source||x.source_label||'Public source')} · confidence ${Number(x.confidence)||0}%</div></div>`).join('')||'<div class="empty">No buyer intelligence yet.</div>'}</div><div class="strategy"><h4>Online / E-commerce Strategy</h4><ul>${onlineStrategy(a,gap,current).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="strategy"><h4>In-Store / Physical Retail Strategy</h4><ul>${storeStrategy(a,gap,current).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="card"><div class="sectionTitle"><h3>Recommended SKU</h3></div>${lead?`<div class="leadSku"><div class="label">LEAD PITCH</div><h3>${esc(lead.product)} · ${esc(lead.variant||'')}</h3><div>${money(lead.msrp)}</div><p class="muted">${esc(lead.reason)}</p></div>`:'<div class="empty">Run the assortment-gap model to recommend the lead SKU.</div>'}</div><div class="card"><div class="sectionTitle"><h3>Pipeline Action</h3></div><p class="muted">Save the current modeled opportunity to the Neon opportunity history. This creates a durable account-level revenue score.</p><button class="btn dark" ${gap?'':'disabled'} onclick="saveOpportunity()">Add to Revenue Pipeline</button></div></div>`}
function portfolioPayload(){const out=[];for(const p of state.products){const vs=(p.variants||[]);if(vs.length)for(const v of vs)out.push({product:p.name,variant:v.variant_name||v.sku,msrp:Number(v.msrp)||0,category:p.category,features:[]});else out.push({product:p.name,variant:'',msrp:0,category:p.category,features:[]})}return out.slice(0,60)}
async function runIntel(){const a=state.currentAccount;if(!a.domain){toast('Add a valid account domain first.');return}state.intel.loading=true;renderAccountDetail();const qs=`domain=${encodeURIComponent(a.domain)}&account=${encodeURIComponent(a.name)}&categories=${encodeURIComponent(a.category||'')}`;const [cur,comp,dm]=await Promise.allSettled([api('/api/current-products?'+qs),api('/api/competitors?'+qs),api('/api/decision-makers?'+qs)]);state.intel.current=cur.status==='fulfilled'?(cur.value.products||[]):[];state.intel.competitors=comp.status==='fulfilled'?(comp.value.competitors||[]):[];state.intel.people=dm.status==='fulfilled'?(dm.value.people||[]):[];try{const g=await api('/api/assortment-gap',{method:'POST',body:JSON.stringify({domain:a.domain,account:a.name,products:portfolioPayload()})});state.intel.gap=g}catch(e){state.intel.gapError=e.message}state.intel.loading=false;renderAccountDetail();toast('Account intelligence refreshed')}
function onlineStrategy(a,g,c){const x=[`Lead with a retailer-specific PDP story for ${a.category||'the category'} rather than a generic brand pitch.`,`Use detected assortment and price bands to position the recommended SKU against visible alternatives.`,`Provide enriched digital assets, comparison copy, specs, SEO terms and channel-ready imagery.`];if((g?.metrics?.price_gap||0)>70)x.push('Exploit the identified price white space with a clear good/better/best architecture.');if(c.length<5)x.push('Low detected assortment density may support a focused launch page or exclusive online test.');return x}
function storeStrategy(a,g,c){const x=[`Frame the sell-in around retailer margin, attachment opportunity and assortment productivity.`,`Use a concise side-by-side competitive story for buyer and merchant review.`,`Propose a low-risk pilot with measurable sell-through and replenishment criteria.`];if((g?.metrics?.feature_gap||0)>70)x.push('Make feature differentiation demonstrable at shelf with simple proof points and merchandising.');if(a.type?.toLowerCase().includes('distribution'))x.push('Translate the pitch into downstream dealer/customer expansion, not just warehouse placement.');return x}
async function saveOpportunity(){if(!state.auth){openAdmin('Unlock admin access to save this opportunity.');return}const a=state.currentAccount,g=state.intel.gap;if(!g)return;const lead=g.recommended_lead_sku;let variantId=null;if(lead){for(const p of state.products){for(const v of (p.variants||[])){if(p.name===lead.product && (v.variant_name===lead.variant||v.sku===lead.variant)){variantId=v.id}}}}try{await api('/api/opportunities',{method:'POST',body:JSON.stringify({account_id:a.id,product_variant_id:variantId,overall_score:g.overall_gap_score,assortment_gap:g.overall_gap_score,price_white_space:g.metrics?.price_gap,feature_differentiation:g.metrics?.feature_gap,competitive_density:g.metrics?.competitive_density,buyer_accessibility:Math.min(100,(state.intel.buyers||[]).length*20+(state.intel.people||[]).length*12),online_fit:75,in_store_fit:75,explanation:{stage:'Target',recommended_sku:lead?`${lead.product} ${lead.variant||''}`.trim():'',account_type:a.type,source:'Launchpad36 V9 account intelligence'}})});const o=await api('/api/opportunities');state.opportunities=o.opportunities||[];toast('Opportunity saved to Neon')}catch(e){toast(e.message)}}
function openModal(html){$('modalBody').innerHTML=html;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}
function openAdmin(msg='Enter the existing ADMIN_SECRET to create an 8-hour secure admin session. The secret is not stored in browser JavaScript.') {openModal(`<div class="modalTop"><div><div class="eyebrow">SECURE WRITE ACCESS</div><h2>Admin Unlock</h2></div><button class="x" onclick="closeModal()">×</button></div><p class="muted">${esc(msg)}</p><div class="form"><label>Admin Secret<input id="adminSecret" type="password" autocomplete="current-password"></label><div style="margin-top:12px"><button class="btn" onclick="unlockAdmin()">Unlock</button> <button class="btn secondary" onclick="logoutAdmin()">Lock Session</button></div></div>`)}
async function unlockAdmin(){try{await api('/api/session',{method:'POST',body:JSON.stringify({secret:$('adminSecret').value})});state.auth=true;renderAuth();closeModal();toast('Admin session unlocked')}catch(e){toast(e.message)}}
async function logoutAdmin(){try{await api('/api/session',{method:'DELETE'});}catch{}state.auth=false;renderAuth();closeModal();toast('Admin session locked')}
function guardWrite(fn){if(!state.auth){openAdmin('Unlock admin access before changing production data.');return}fn()}
function openAccountForm(){guardWrite(()=>openModal(`<div class="modalTop"><div><div class="eyebrow">NEW TARGET ACCOUNT</div><h2>Add Account</h2></div><button class="x" onclick="closeModal()">×</button></div><div class="form formGrid"><label>Name<input id="aName"></label><label>Channel<select id="aType"><option>National Retailer</option><option>Regional Retailer</option><option>Independent Retailer</option><option>National Distributor</option><option>Regional Distributor</option><option>Specialty / Dealer Network</option><option>E-commerce</option><option>Buying Group</option><option>Other</option></select></label><label>Coverage<input id="aCoverage" placeholder="National, Northeast, etc."></label><label>Domain<input id="aDomain" placeholder="retailer.com"></label><label>Category<input id="aCategory" placeholder="Audio, TV mounts, office furniture"></label><label>Potential Revenue<input id="aPotential" type="number"></label><label>L36 Score<input id="aScore" type="number" min="0" max="100"></label><label class="full">Notes<textarea id="aNotes"></textarea></label><div class="full"><button class="btn" onclick="saveAccount()">Save Account</button></div></div>`))}
async function saveAccount(){try{await api('/api/accounts',{method:'POST',body:JSON.stringify({name:$('aName').value,type:$('aType').value,coverage:$('aCoverage').value,domain:$('aDomain').value,category:$('aCategory').value,potential:$('aPotential').value,score:$('aScore').value,notes:$('aNotes').value,source:'v9'})});await loadCore();closeModal();show('Accounts');toast('Account saved to Neon')}catch(e){toast(e.message)}}
function openBuyerForm(){guardWrite(()=>openModal(`<div class="modalTop"><div><div class="eyebrow">BUYER INTELLIGENCE</div><h2>Add Buyer</h2></div><button class="x" onclick="closeModal()">×</button></div><div class="form formGrid"><label>Account<select id="bAccount">${state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label><label>Name<input id="bName"></label><label>Title<input id="bTitle"></label><label>Category<input id="bCategory"></label><label>Public Email<input id="bEmail"></label><label>Public Phone<input id="bPhone"></label><label>LinkedIn / Professional URL<input id="bLinkedin"></label><label>Source URL<input id="bSourceUrl"></label><label>Confidence<input id="bConfidence" type="number" min="0" max="100"></label><label>Status<select id="bStatus"><option>Current</option><option>Publicly Listed</option><option>Stale / Unverified</option></select></label><div class="full"><button class="btn" onclick="saveBuyer()">Save Buyer</button></div></div>`))}
async function saveBuyer(){try{await api('/api/buyers',{method:'POST',body:JSON.stringify({account_id:$('bAccount').value,name:$('bName').value,title:$('bTitle').value,category:$('bCategory').value,email:$('bEmail').value,phone:$('bPhone').value,linkedin:$('bLinkedin').value,source:'manual-public',source_url:$('bSourceUrl').value,confidence:$('bConfidence').value,status:$('bStatus').value})});await loadCore();closeModal();show('Buyers');toast('Buyer saved to Neon')}catch(e){toast(e.message)}}
function openProductForm(){guardWrite(()=>{openModal(`<div class="modalTop"><div><div class="eyebrow">PORTFOLIO</div><h2>Add Product + SKUs</h2></div><button class="x" onclick="closeModal()">×</button></div><div class="form formGrid"><label>Product Name<input id="pName"></label><label>Category<input id="pCategory"></label><label class="full">Positioning<textarea id="pPosition"></textarea></label><label class="full">Differentiator<textarea id="pDiff"></textarea></label><div class="full"><div class="sectionTitle"><h3>Variants / SKUs</h3><button class="btn small ghost" onclick="addVariantRow()">+ Variant</button></div><div id="variantRows"></div></div><div class="full"><button class="btn" onclick="saveProduct()">Save Product</button></div></div>`);addVariantRow()})}
function addVariantRow(){const d=document.createElement('div');d.className='variantRow';d.innerHTML=`<label>SKU<input data-k="sku"></label><label>Variant<input data-k="name"></label><label>MSRP<input data-k="msrp" type="number"></label><label>Wholesale<input data-k="wholesale" type="number"></label><button class="x" onclick="this.parentElement.remove()">×</button>`;$('variantRows').appendChild(d)}
async function saveProduct(){const variants=[...document.querySelectorAll('.variantRow')].map(r=>Object.fromEntries([...r.querySelectorAll('input')].map(x=>[x.dataset.k,x.value]))).filter(v=>v.sku||v.name);try{await api('/api/products',{method:'POST',body:JSON.stringify({name:$('pName').value,category:$('pCategory').value,positioning:$('pPosition').value,differentiator:$('pDiff').value,variants})});await loadCore();closeModal();show('Products');toast('Product saved to Neon')}catch(e){toast(e.message)}}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});boot();
</script>
</body></html>
